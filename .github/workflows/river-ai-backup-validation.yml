name: RiverSSAI backup script validation
on:
  pull_request:
    paths:
      - 'infra/river-ai/backup-encrypted.sh'
      - 'infra/river-ai/restore-drill.sh'
      - 'infra/river-ai/verify-encrypted-backup.sh'
      - 'infra/river-ai/test-backup-integrity.sh'
      - 'infra/river-ai/hmac_sha256.py'
      - 'infra/river-ai/POINT-2-ENCRYPTED-BACKUP.md'
      - '.github/workflows/river-ai-backup-validation.yml'
      - '.gitignore'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n infra/river-ai/backup-encrypted.sh infra/river-ai/restore-drill.sh infra/river-ai/verify-encrypted-backup.sh infra/river-ai/test-backup-integrity.sh
      - name: Ensure scripts do not contain obvious unsafe flags
        run: |
          ! grep -E 'down[[:space:]]+-v|rm[[:space:]]+-rf' infra/river-ai/backup-encrypted.sh infra/river-ai/restore-drill.sh infra/river-ai/verify-encrypted-backup.sh infra/river-ai/test-backup-integrity.sh
      - name: Verify backup artifacts are ignored
        run: |
          grep -F 'infra/river-ai/.env' .gitignore
          grep -F 'infra/river-ai/backups/' .gitignore
          grep -F '*.dump.enc.hmac' .gitignore
          grep -F '*.tmp' .gitignore
      - name: Exercise integrity verifier with synthetic fixtures
        run: bash infra/river-ai/test-backup-integrity.sh
