name: RiverSSAI backup script validation
on:
  pull_request:
    paths:
      - 'infra/river-ai/backup-encrypted.sh'
      - 'infra/river-ai/restore-drill.sh'
      - 'infra/river-ai/POINT-2-ENCRYPTED-BACKUP.md'
      - '.github/workflows/river-ai-backup-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n infra/river-ai/backup-encrypted.sh infra/river-ai/restore-drill.sh
      - name: Ensure scripts do not contain obvious unsafe flags
        run: |
          ! grep -E 'down[[:space:]]+-v|rm[[:space:]]+-rf' infra/river-ai/backup-encrypted.sh infra/river-ai/restore-drill.sh
