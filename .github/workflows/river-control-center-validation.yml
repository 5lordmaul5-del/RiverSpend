name: River Control Center Validation

on:
  push:
    branches:
      - feat/river-fortress-integration-core
    paths:
      - "apps/riverspend-panel-control/**"
      - ".github/workflows/river-control-center-validation.yml"
  pull_request:
    paths:
      - "apps/riverspend-panel-control/**"
      - ".github/workflows/river-control-center-validation.yml"

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/riverspend-panel-control
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo project configuration
        run: npx expo-doctor
      - name: Export Android JavaScript bundle
        run: npx expo export --platform android
      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install
      - name: Build installable Android debug APK
        working-directory: apps/riverspend-panel-control/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: river-control-center-android-debug
          path: apps/riverspend-panel-control/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
