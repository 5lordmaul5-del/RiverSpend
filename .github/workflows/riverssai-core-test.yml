name: RiverSSAI Core Tests
on:
  pull_request:
    paths:
      - 'river-ai/**'
      - '.github/workflows/riverssai-core-test.yml'
  push:
    branches:
      - 'feat/riverssai-10-runnable-core-2026-11-25'
    paths:
      - 'river-ai/**'
      - '.github/workflows/riverssai-core-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run RiverSSAI tests
        working-directory: river-ai
        run: npm test
