name: RiverSSAI backup script validation
on:
  pull_request:
    paths:
      - 'infra/river-ai/backup-owner-db.sh'
      - 'infra/river-ai/restore-owner-db.sh'
      - 'infra/river-ai/tests/restore-target-guard-test.sh'
      - 'infra/river-ai/tests/backup-restore-roundtrip-test.sh'
      - '.github/workflows/river-ai-backup-script-validation.yml'
jobs:
  validate-backup-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n infra/river-ai/backup-owner-db.sh infra/river-ai/restore-owner-db.sh
      - name: Test restore target guard
        run: bash infra/river-ai/tests/restore-target-guard-test.sh
      - name: Test synthetic backup/restore round trip
        run: bash infra/river-ai/tests/backup-restore-roundtrip-test.sh
      - name: Check script safety markers
        run: |
          grep -q 'RIVERBACKUP_PASSPHRASE' infra/river-ai/backup-owner-db.sh
          grep -q 'sha256sum' infra/river-ai/backup-owner-db.sh
          grep -q 'openssl dgst -sha256 -hmac' infra/river-ai/backup-owner-db.sh
          grep -q 'RIVERBACKUP_FILE.hmac' infra/river-ai/restore-owner-db.sh
          grep -q 'expected_hmac' infra/river-ai/restore-owner-db.sh
          grep -q 'RIVERBACKUP_TARGET_DB' infra/river-ai/restore-owner-db.sh
          ! grep -q -- '--clean' infra/river-ai/restore-owner-db.sh
          ! grep -q -- 'DROP DATABASE' infra/river-ai/restore-owner-db.sh
