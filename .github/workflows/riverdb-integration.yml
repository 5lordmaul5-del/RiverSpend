name: RiverDB Integration
on:
  pull_request:
    paths:
      - 'infra/riverdb/**'
      - '.github/workflows/riverdb-integration.yml'
  push:
    branches: [feat/riverdb-core-2026-11-25]
    paths:
      - 'infra/riverdb/**'
      - '.github/workflows/riverdb-integration.yml'
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: riverdb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d riverdb_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: infra/riverdb
        run: npm install
      - name: Apply migrations
        working-directory: infra/riverdb
        env:
          RIVERDB_MIGRATION_URL: postgresql://postgres:test-only-password@localhost:5432/riverdb_test
        run: bash ./scripts/migrate.sh
      - name: Run integration tests
        working-directory: infra/riverdb
        env:
          RIVERDB_TEST_URL: postgresql://postgres:test-only-password@localhost:5432/riverdb_test
        run: npm test
      - name: Backup and restore verification (isolated CI database)
        env:
          RIVERDB_TEST_URL: postgresql://postgres:test-only-password@localhost:5432/riverdb_test
        run: |
          set -eu
          export PGPASSWORD=test-only-password
          pg_dump --format=custom --no-owner --no-acl "$RIVERDB_TEST_URL" > /tmp/riverdb-ci.dump
          psql "postgresql://postgres:test-only-password@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS riverdb_restore_test;"
          psql "postgresql://postgres:test-only-password@localhost:5432/postgres" -v ON_ERROR_STOP=1 -c "CREATE DATABASE riverdb_restore_test;"
          pg_restore --no-owner --no-acl --dbname "postgresql://postgres:test-only-password@localhost:5432/riverdb_restore_test" /tmp/riverdb-ci.dump
          test "$(psql "postgresql://postgres:test-only-password@localhost:5432/riverdb_restore_test" -tAc "SELECT count(*) FROM riverdb.modules")" -ge 3
          test "$(psql "postgresql://postgres:test-only-password@localhost:5432/riverdb_restore_test" -tAc "SELECT count(*) FROM riverdb.tasks")" -ge 1
          echo "Backup/restore drill verified: modules and task data restored."
      - name: Validate runtime permissions
        env:
          RIVERDB_MIGRATION_URL: postgresql://postgres:test-only-password@localhost:5432/riverdb_test
          RIVERDB_RUNTIME_TEST_URL: postgresql://riverdb_runtime:riverdb-ci-only-password@localhost:5432/riverdb_test
        run: |
          psql "$RIVERDB_MIGRATION_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE riverdb_runtime WITH PASSWORD 'riverdb-ci-only-password';"
          node infra/riverdb/tests/runtime-permissions.test.mjs
      - name: Compose and shell checks
        run: |
          sh -n infra/riverdb/scripts/backup.sh
          sh -n infra/riverdb/scripts/restore.sh
          sh -n infra/riverdb/scripts/migrate.sh
