name: RC161 supervised local RiverSSAI integration

on:
  push:
    branches:
      - feat/rc161-supervised-http-integration-2026-11-27
  pull_request:
    branches:
      - feat/river-ssai-local-http-core-2026-11-27

permissions:
  contents: read

jobs:
  supervised-local-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify RC161 supervisor and HTTP integration
        run: |
          python3 -m unittest discover -s infra/river-ai -p 'test_rc161_sandbox_supervisor.py'
          python3 -m unittest discover -s infra/river-ai -p 'test_rc161_supervised_http.py'
          python3 -m unittest discover -s infra/river-ai -p 'test_river_ssai_local_http.py'
          python3 -m unittest discover -s infra/river-ai -p 'test_river_ssai_jwt.py'
          python3 -m unittest discover -s infra/river-ai -p 'test_rc181_authenticated_intake.py'
          python3 -m unittest discover -s infra/river-ai -p 'test_rc183_integrated_worker.py'
          python3 -m unittest discover -s infra/river-ai -p 'test_rc180_contract_bridge.py'
