name: RiverSSAI Creative Studio validation

on:
  pull_request:
    branches: [main]
    paths:
      - "pages/river-ai.js"
      - "pages/river-ai/creative-studio.js"
      - "pages/index.js"
      - "public/images/river-agent-*.svg"
      - "pages/api/river-ai/creative/**"
      - "public/river-ssai/creative-studio-registry.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/creative-studio-validation.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check server route syntax
        run: |
          node --check pages/api/river-ai/creative/image.js
          node --check pages/api/river-ai/creative/image-file.js
          node --check pages/api/river-ai/creative/video.js
      - name: Build Next.js application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
        run: npm run build
