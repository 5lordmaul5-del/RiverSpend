name: RiverSSAI independent runtime validation

on:
  pull_request:
    paths:
      - "infra/river-ai/**"
      - "server/river-ai-standalone.mjs"
      - "lib/riverSSAI/**"
      - "scripts/river-ai/**"
      - ".github/workflows/river-ai-validation.yml"
  push:
    branches:
      - feat/riverssai-10-independent-core-90
    paths:
      - "infra/river-ai/**"
      - "server/river-ai-standalone.mjs"
      - "lib/riverSSAI/**"
      - "scripts/river-ai/**"
      - ".github/workflows/river-ai-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate registry and specialist routing
        run: node scripts/river-ai/validate-runtime.mjs
      - name: Validate JavaScript syntax
        run: |
          node --check server/river-ai-standalone.mjs
          node --check lib/riverSSAI/agentsRegistry.mjs
          node --check lib/riverSSAI/router.mjs
      - name: Validate Docker Compose configuration
        run: |
          cat > infra/river-ai/.env <<'EOF'
          RIVERDB_PASSWORD=ci-test-password-1234567890
          RIVER_AI_ADMIN_TOKEN=ci-test-admin-token-at-least-32-characters
          RIVER_AI_LOCAL_MODEL=qwen2.5:7b
          EOF
          docker compose -f infra/river-ai/docker-compose.yml config --quiet
      - name: Build standalone runtime image
        run: docker build -f infra/river-ai/Dockerfile -t riverssai-independent-core:ci .
