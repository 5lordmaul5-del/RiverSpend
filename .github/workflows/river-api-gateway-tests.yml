name: River API Gateway Core Tests
on:
  push:
    branches: [feat/river-api-gateway-core-2026-11-26]
    paths:
      - api-gateway/**
      - .github/workflows/river-api-gateway-tests.yml
  pull_request:
    branches: [main]
    paths:
      - api-gateway/**
      - .github/workflows/river-api-gateway-tests.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run key-manager tests
        run: node --test api-gateway/test/*.test.js
