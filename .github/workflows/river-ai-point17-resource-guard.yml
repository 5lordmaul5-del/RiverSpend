name: RiverSSAI Point 17 checklist validation
on:
  pull_request:
    paths:
      - 'infra/river-ai/POINT-17-RESOURCE-GUARD.md'
      - '.github/workflows/river-ai-point17-resource-guard.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -F 'Completion criteria' infra/river-ai/POINT-17-RESOURCE-GUARD.md
          grep -F 'isolated, non-production' infra/river-ai/POINT-17-RESOURCE-GUARD.md
