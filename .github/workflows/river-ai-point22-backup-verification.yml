name: RiverSSAI Point 22 checklist
on:
  pull_request:
    paths:
      - 'infra/river-ai/POINT-22-BACKUP-VERIFICATION.md'
      - '.github/workflows/river-ai-point22-backup-verification.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -F 'Completion criteria' infra/river-ai/POINT-22-BACKUP-VERIFICATION.md
      - run: grep -F 'isolated environment' infra/river-ai/POINT-22-BACKUP-VERIFICATION.md