name: RiverSSAI River API mock integration tests
on:
  pull_request:
    paths:
      - 'river-integration/**'
      - '.github/workflows/river-integration-tests.yml'
  push:
    branches:
      - 'feat/riverssai-riverapi-mock-gateway-2026-11-26'
    paths:
      - 'river-integration/**'
      - '.github/workflows/river-integration-tests.yml'
permissions:
  contents: read
jobs:
  mock-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated mock integration tests
        run: node --test river-integration/test/facade.test.js
