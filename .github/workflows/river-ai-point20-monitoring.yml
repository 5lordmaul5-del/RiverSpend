name: RiverSSAI Point 20 checklist validation
on:
  pull_request:
    paths:
      - 'infra/river-ai/POINT-20-MONITORING.md'
      - '.github/workflows/river-ai-point20-monitoring.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -F 'Completion criteria' infra/river-ai/POINT-20-MONITORING.md
          grep -F 'isolated, non-production' infra/river-ai/POINT-20-MONITORING.md
