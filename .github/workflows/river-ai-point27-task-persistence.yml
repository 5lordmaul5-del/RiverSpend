name: RiverSSAI Point 27 checklist
on:
  pull_request:
    paths:
      - 'infra/river-ai/POINT-27-TASK-PERSISTENCE.md'
      - '.github/workflows/river-ai-point27-task-persistence.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -F 'Completion criteria' infra/river-ai/POINT-27-TASK-PERSISTENCE.md
      - run: grep -F 'isolated, non-production' infra/river-ai/POINT-27-TASK-PERSISTENCE.md