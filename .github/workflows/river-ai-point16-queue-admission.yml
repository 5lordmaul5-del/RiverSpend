name: RiverSSAI Point 16 checklist validation
on:
  pull_request:
    paths:
      - 'infra/river-ai/POINT-16-QUEUE-ADMISSION.md'
      - '.github/workflows/river-ai-point16-queue-admission.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          grep -F 'Completion criteria' infra/river-ai/POINT-16-QUEUE-ADMISSION.md
          grep -F 'isolated, non-production' infra/river-ai/POINT-16-QUEUE-ADMISSION.md
