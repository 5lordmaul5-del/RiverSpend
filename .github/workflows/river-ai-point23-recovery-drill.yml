name: RiverSSAI Point 23 checklist
on:
  pull_request:
    paths:
      - 'infra/river-ai/POINT-23-RECOVERY-DRILL.md'
      - '.github/workflows/river-ai-point23-recovery-drill.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -F 'Completion criteria' infra/river-ai/POINT-23-RECOVERY-DRILL.md
      - run: grep -F 'isolated environment' infra/river-ai/POINT-23-RECOVERY-DRILL.md