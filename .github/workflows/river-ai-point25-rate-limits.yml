name: RiverSSAI Point 25 checklist
on:
  pull_request:
    paths:
      - 'infra/river-ai/POINT-25-RATE-LIMITS.md'
      - '.github/workflows/river-ai-point25-rate-limits.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: grep -F 'Completion criteria' infra/river-ai/POINT-25-RATE-LIMITS.md
      - run: grep -F 'isolated, non-production' infra/river-ai/POINT-25-RATE-LIMITS.md