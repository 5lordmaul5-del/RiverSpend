name: RiverCloud isolated tests

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/rivercloud/**"
      - ".github/workflows/rivercloud-tests.yml"
  push:
    branches:
      - "feat/rivercloud-core-2026-11-25"
    paths:
      - "infra/rivercloud/**"
      - ".github/workflows/rivercloud-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rivercloud-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run RiverCloud Node tests
        run: node --test infra/rivercloud/*.test.mjs
