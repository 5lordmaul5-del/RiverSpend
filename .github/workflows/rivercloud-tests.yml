name: RiverCloud isolated tests

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/rivercloud/**"
      - ".github/workflows/rivercloud-tests.yml"
  push:
    branches:
      - "feat/rivercloud-core-2026-11-25"
    paths:
      - "infra/rivercloud/**"
      - ".github/workflows/rivercloud-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rivercloud-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Run RiverCloud Node tests
        run: node --test infra/rivercloud/*.test.mjs
      - name: Validate bootstrap shell syntax
        run: sh -n infra/rivercloud/bootstrap.sh
      - name: Validate backup/restore and Python extractor syntax
        run: |
          sh -n infra/rivercloud/scripts/backup.sh infra/rivercloud/scripts/restore.sh
          python3 -m py_compile infra/rivercloud/scripts/restore-safe.py infra/rivercloud/scripts/restore-safe-race-test.py
      - name: Test restore extraction against directory replacement race
        run: python3 infra/rivercloud/scripts/restore-safe-race-test.py
      - name: Validate Compose configuration without starting services
        run: docker compose -f infra/rivercloud/docker-compose.yml --env-file infra/rivercloud/.env.example config
      - name: Validate Caddyfile with pinned Caddy image
        run: docker run --rm -e RIVERCLOUD_DOMAIN=cloud.example.com -v "$PWD/infra/rivercloud/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b caddy validate --config /etc/caddy/Caddyfile
