name: RC196 idempotency registry tests
on:
  push:
    branches:
      - feat/rc196-idempotency-integrity-2026-11-27
    paths:
      - "infra/river-ai/rc196_idempotency_registry.py"
      - "infra/river-ai/test_rc196_idempotency_registry.py"
      - ".github/workflows/rc196-idempotency-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run RC196 tests
        run: python3 -m unittest discover -s infra/river-ai -p 'test_rc196_idempotency_registry.py'
