<!doctype html>
<html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverCine • RiverSSAI Command Center</title>
<style>body{margin:0;background:#101820;color:#eaf5f7;font:16px system-ui}main{max-width:1050px;margin:auto;padding:28px}h1{color:#66d9d0}section{background:#1a2b36;border:1px solid #35505e;border-radius:14px;padding:18px;margin:16px 0}button{background:#1c9b91;color:white;border:0;padding:12px;border-radius:9px}textarea,input,select{background:#0d1720;color:white;border:1px solid #426070;border-radius:7px;padding:10px;width:100%;box-sizing:border-box;margin:6px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}</style>
<main><h1>RiverCine Studios — RiverSSAI Core</h1><p>Command center concept: RiverSSAI coordinates creative modules and planning workflows.</p>
<section><h2>Brief creativo</h2><div class="grid"><div><label>Progetto</label><input id="project" placeholder="Titolo"></div><div><label>Formato</label><select id="format"><option>Film</option><option>Serie</option><option>Spot</option><option>Game cinematic</option><option>Documentario</option></select></div><div><label>Stile</label><input id="style" placeholder="Tono, stile, mood"></div></div><label>Brief</label><textarea id="brief" rows="5" placeholder="Idea, vincoli, pubblico, obiettivi…"></textarea></section>
<section><h2>Moduli coordinati</h2><div class="grid" id="modules"></div></section><section><h2>Piano coordinamento</h2><textarea id="plan" rows="6" placeholder="Piano generato/compilato dal workflow"></textarea><button id="export">Esporta brief e piano JSON</button><pre id="out"></pre></section>
<script>const names=["RiverScript","RiverStory","RiverStoryboard","RiverSAnimationS","River Virtual Production","RiverVFX","RiverEdit","RiverColor","River ISSA","RiverRender","RiverGames Cinematics","RiverDistribution"];document.querySelector("#modules").innerHTML=names.map(n=>'<div><label>'+n+'</label><select data-module="'+n+'"><option>Not planned</option><option>Planned</option><option>In review</option><option>Ready</option></select></div>').join("");document.querySelector("#export").onclick=()=>{let data={project:document.querySelector("#project").value,format:document.querySelector("#format").value,style:document.querySelector("#style").value,brief:document.querySelector("#brief").value,modules:Object.fromEntries([...document.querySelectorAll("[data-module]")].map(x=>[x.dataset.module,x.value])),plan:document.querySelector("#plan").value,prototype:true};document.querySelector("#out").textContent=JSON.stringify(data,null,2);let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="rivercine-riverssai-plan.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}</script></main></html>
