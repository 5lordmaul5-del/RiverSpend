<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverSSAI • Live Score Core</title><style>body{margin:0;background:#101820;color:#eaf5f7;font:16px system-ui}main{max-width:1100px;margin:auto;padding:22px}h1{color:#65d8d0}.card{background:#1a2b36;border:1px solid #35505e;border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}select,input{width:100%;box-sizing:border-box;background:#0d1720;color:white;border:1px solid #426070;padding:9px;border-radius:7px}button{background:#16988e;color:white;border:0;border-radius:8px;padding:11px;margin:6px 4px 6px 0;cursor:pointer}.score{overflow:auto;background:#f5f2e9;color:#15232b;border-radius:8px;padding:10px}svg{min-width:800px}.note{cursor:pointer}pre{white-space:pre-wrap}</style><main><h1>RiverSSAI • Live Score Core</h1><p>Editor musicale interattivo prototipo: modifica note sulla griglia, ascolta la sequenza, esporta MIDI e MusicXML.</p><div class="card grid"><div><label>Tempo BPM</label><input id="bpm" type="number" value="100" min="30" max="240"></div><div><label>Strumento (preview)</label><select id="voice"><option value="triangle">Legni (triangolare)</option><option value="sine">Sinusoidale</option><option value="square">Synth</option></select></div><div><label>Durata nota (beat)</label><select id="dur"><option value="1">1 beat</option><option value="2">2 beat</option><option value="0.5">1/2 beat</option></select></div></div><div class="card"><h2>Score — 16 eventi</h2><p>Click su una cella per aggiungere/rimuovere una nota. Il prototipo mostra una singola linea melodica.</p><div class="score" id="score"></div><button id="play">▶ Ascolta</button><button id="stop">■ Stop</button><button id="xml">Esporta MusicXML</button><button id="midi">Esporta MIDI</button><button id="json">Esporta JSON</button><pre id="msg"></pre></div></main><script>const pitches=[{n:"C5",m:72},{n:"B4",m:71},{n:"A4",m:69},{n:"G4",m:67},{n:"F4",m:65},{n:"E4",m:64},{n:"D4",m:62},{n:"C4",m:60},{n:"B3",m:59},{n:"A3",m:57},{n:"G3",m:55}];let events=Array(16).fill(null),dur=1,playing=false,osc=[];function draw(){let s='<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg"><rect width="1000" height="360" fill="#f5f2e9"/>';for(let r=0;r<pitches.length;r++){let y=45+r*25;s+='<line x1="60" y1="'+y+'" x2="960" y2="'+y+'" stroke="#a4a4a4"/><text x="8" y="'+(y+5)+'" font-size="14" fill="#24323b">'+pitches[r].n+'</text>'}for(let c=0;c<16;c++){let x=70+c*55;s+='<line x1="'+x+'" y1="35" x2="'+x+'" y2="300" stroke="#ddd"/><text x="'+(x+4)+'" y="330" fill="#24323b">'+(c+1)+'</text>';if(events[c]){let r=pitches.findIndex(p=>p.m===events[c]);let y=45+r*25;s+='<circle class="note" cx="'+(x+15)+'" cy="'+y+'" r="10" fill="#157e75" stroke="#102c30" onclick="toggle('+c+')"/>'}}s+='</svg>';document.querySelector("#score").innerHTML=s}window.toggle=function(c){events[c]=events[c]===null?64: null;draw()};function renderMidi(){const ticks=480, tempo=+document.querySelector("#bpm").value;function vlq(v){let b=[v&127];while(v>>=7)b.unshift((v&127)|128);return b}let track=[];let us=60000000/tempo;track.push(0,255,81,3,(us>>16)&255,(us>>8)&255,us&255);let last=0;for(let i=0;i<events.length;i++){if(events[i]!==null){let t=i*ticks;track.push(...vlq(t-last),144,events[i],90);last=t;track.push(...vlq(ticks),128,events[i],0);last=t+ticks}}track.push(0,255,47,0);let data=[77,84,104,100,0,0,0,6,0,0,0,1,1,224,77,84,114,107,(track.length>>24)&255,(track.length>>16)&255,(track.length>>8)&255,track.length&255,...track];return new Uint8Array(data)}function xml(){let bpm=+document.querySelector("#bpm").value;let notes=events.map(n=>n===null?'<note><rest/><duration>1</duration></note>':'<note><pitch><step>'+({60:"C",62:"D",64:"E",65:"F",67:"G",69:"A",71:"B",72:"C"}[n]||"C")+'</step><octave>'+Math.floor(n/12-1)+'</octave></pitch><duration>1</duration><type>quarter</type></note>').join("");return '<?xml version="1.0" encoding="UTF-8"?><score-partwise version="4.0"><part-list><score-part id="P1"><part-name>RiverSSAI melody</part-name></score-part></part-list><part id="P1"><measure number="1"><attributes><divisions>1</divisions><time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes><direction><sound tempo="'+bpm+'"/></direction>'+notes+'</measure></part></score-partwise>'}function dl(data,name,type){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.querySelector("#xml").onclick=()=>dl(xml(),"river-score.musicxml","application/vnd.recordare.musicxml+xml");document.querySelector("#midi").onclick=()=>dl(renderMidi(),"river-score.mid","audio/midi");document.querySelector("#json").onclick=()=>dl(JSON.stringify({bpm:+document.querySelector("#bpm").value,events,selectedVoice:document.querySelector("#voice").value},null,2),"river-score.json","application/json");document.querySelector("#play").onclick=async()=>{if(playing)return;playing=true;let ctx=new(window.AudioContext||window.webkitAudioContext)();let step=60000/+document.querySelector("#bpm").value;for(let i=0;i<events.length&&playing;i++){if(events[i]!==null){let o=ctx.createOscillator(),g=ctx.createGain();o.type=document.querySelector("#voice").value;o.frequency.value=440*Math.pow(2,(events[i]-69)/12);g.gain.value=.1;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+step/1000*.85);}await new Promise(r=>setTimeout(r,step))}playing=false;ctx.close()};document.querySelector("#stop").onclick=()=>playing=false;draw();</script></main></html>
