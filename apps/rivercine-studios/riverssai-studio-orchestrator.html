<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverSSAI • Orchestrator</title><style>body{background:#101820;color:#eaf5f7;font:16px system-ui;margin:0}main{max-width:1050px;margin:auto;padding:24px}h1{color:#65d8d0}section{background:#1a2b36;padding:18px;border:1px solid #35505e;border-radius:12px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;background:#0d1720;color:white;border:1px solid #426070;border-radius:7px;margin:5px 0}button{background:#16988e;color:white;border:0;padding:11px 14px;border-radius:8px;cursor:pointer}.task{border:1px solid #456170;border-radius:9px;padding:12px;margin:8px 0}pre{white-space:pre-wrap}</style><main><h1>RiverSSAI — Studio Orchestrator</h1><p>Prototipo di pianificazione del workflow: dipendenze, moduli, priorità e gate di revisione.</p><section><h2>Workflow</h2><div class="grid"><div><label>Progetto</label><input id="project" placeholder="Titolo progetto"></div><div><label>Obiettivo</label><input id="goal" placeholder="Risultato desiderato"></div><div><label>Priorità</label><select id="priority"><option>Normal</option><option>High</option><option>Critical</option></select></div></div><label>Note / vincoli</label><textarea id="notes" rows="3"></textarea><button id="add">Aggiungi attività</button></section><section><h2>Attività orchestrate</h2><div id="tasks"></div><button id="export">Esporta workflow JSON</button><pre id="out"></pre></section></main><script>let tasks=[];const stages=["RiverScript","RiverStory","RiverStoryboard","RiverSAnimationS","Virtual Production","RiverVFX","RiverEdit","RiverColor","River ISSA","RiverRender","RiverGames Cinematics","RiverDistribution"];function draw(){document.querySelector("#tasks").innerHTML=tasks.map((t,i)=>'<div class="task"><b>'+t.module+'</b> · '+t.priority+'<p>'+t.task+'</p><p>Depends on: '+(t.dependencies.join(", ")||"none")+'</p><label>Status</label><select onchange="tasks['+i+'].status=this.value;draw()"><option '+(t.status==="Planned"?"selected":"")+'>Planned</option><option '+(t.status==="Review"?"selected":"")+'>Review</option><option '+(t.status==="Ready"?"selected":"")+'>Ready</option><option '+(t.status==="Blocked"?"selected":"")+'>Blocked</option></select></div>').join("")}document.querySelector("#add").onclick=()=>{let mod=stages[tasks.length%stages.length],deps=tasks.length?[tasks[tasks.length-1].module]:[];tasks.push({id:"task-"+(tasks.length+1),module:mod,task:"Define and review deliverable for "+mod,dependencies:deps,priority:document.querySelector("#priority").value,status:"Planned",humanReviewRequired:true});draw()};document.querySelector("#export").onclick=()=>{let data={project:document.querySelector("#project").value,goal:document.querySelector("#goal").value,notes:document.querySelector("#notes").value,workflow:tasks,prototype:true,executionEnabled:false};document.querySelector("#out").textContent=JSON.stringify(data,null,2);let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="riverssai-studio-workflow.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></html>
