<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverVFX — Shot Graph Lab</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#101820;color:#edf4f8;font:16px system-ui}header{padding:24px;background:linear-gradient(120deg,#123b45,#162333)}main{max-width:1100px;margin:auto;padding:20px}h1{margin:0;color:#9fe4e8}button,input,select,textarea{font:inherit;background:#192a36;color:#edf4f8;border:1px solid #3c5667;border-radius:8px;padding:9px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{background:#172630;border:1px solid #324b5a;border-radius:12px;padding:15px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.shot{border-left:4px solid #6ec6c9}.muted{color:#9cb4c1}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin:6px 0}.status{color:#e8c87a}
</style></head><body><header><h1>RiverVFX — Shot Graph Lab</h1><p>RC237 · Architettura di pianificazione e pipeline · prototipo</p></header><main>
<p class="muted">Organizza gli shot e le fasi di compositing. Questo prototipo salva i dati solo nell'esportazione JSON: non esegue rendering.</p>
<section class="card"><h2>Nuovo shot</h2><div class="row"><input id="name" placeholder="Nome shot / scena"><input id="plate" placeholder="Plate / riferimento"></div><div class="row"><select id="stage"><option>Ingest & Prep</option><option>Tracking</option><option>Roto / Matte</option><option>FX Elements</option><option>Compositing</option><option>Color & Review</option><option>Final</option></select><input id="notes" placeholder="Note tecniche"></div><button onclick="addShot()">Aggiungi shot</button></section>
<h2>Shot Graph</h2><div id="shots" class="grid"></div><div class="row"><button onclick="exportJSON()">Esporta progetto JSON</button><button onclick="checkQuality()">Quality Gate</button></div><pre id="report" class="card"></pre>
<script>
let shots=[];
function addShot(){let n=document.getElementById('name').value.trim();if(!n)return;shots.push({id:'shot-'+(shots.length+1),name:n,plate:document.getElementById('plate').value,stage:document.getElementById('stage').value,notes:document.getElementById('notes').value,layers:[],review:{temporalStability:false,compositingReview:false,colorReview:false}});render();document.getElementById('name').value='';document.getElementById('plate').value='';document.getElementById('notes').value=''}
function addLayer(i){let t=prompt('Nome elemento/layer');if(t){shots[i].layers.push({name:t,kind:'element',enabled:true,source:null});render()}}
function removeShot(i){shots.splice(i,1);render()}
function toggle(i,k){shots[i].review[k]=!shots[i].review[k];render()}
function render(){document.getElementById('shots').innerHTML=shots.map((s,i)=>'<article class="card shot"><h3>'+esc(s.name)+'</h3><p><b>Stage:</b> '+esc(s.stage)+'</p><p><b>Plate:</b> '+esc(s.plate||'—')+'</p><p>'+esc(s.notes||'')+'</p><h4>Layers / elementi</h4><ul>'+s.layers.map(x=>'<li>'+esc(x.name)+'</li>').join('')+'</ul><div class="row"><button onclick="addLayer('+i+')">+ Layer</button><button onclick="toggle('+i+',\'temporalStability\')">Temporal: '+(s.review.temporalStability?'OK':'da verificare')+'</button><button onclick="toggle('+i+',\'compositingReview\')">Comp: '+(s.review.compositingReview?'OK':'da verificare')+'</button><button onclick="toggle('+i+',\'colorReview\')">Color: '+(s.review.colorReview?'OK':'da verificare')+'</button><button onclick="removeShot('+i+')">Elimina</button></div></article>').join('')||'<p class="muted">Nessuno shot aggiunto.</p>'}
function checkQuality(){let incomplete=shots.filter(s=>!Object.values(s.review).every(Boolean));document.getElementById('report').textContent=shots.length+' shot. '+incomplete.length+' non ancora con tutti i controlli approvati.\n'+incomplete.map(s=>'• '+s.name+': controlli da completare').join('\n')+'\n\nChecklist: temporal stability, compositing, color review. Questi flag sono manuali, non verifiche automatiche.'}
function exportJSON(){let d={schemaVersion:'1.0',product:'RiverVFX',projectName:'RiverVFX Shot Graph',shots};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='rivervfx-shotgraph.json';a.click();URL.revokeObjectURL(a.href)}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
</script></main></body></html>
