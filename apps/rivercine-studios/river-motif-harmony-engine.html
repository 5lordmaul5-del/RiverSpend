<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverSSAI • Motif & Harmony Lab</title><style>body{font:16px system-ui;background:#111820;color:#eaf4f6;margin:0}main{max-width:1100px;margin:auto;padding:22px}h1{color:#62d7ce}.card{background:#1c2b35;border:1px solid #395461;border-radius:12px;padding:16px;margin:14px 0}input,select{padding:10px;background:#101c24;color:#fff;border:1px solid #46606d;border-radius:8px;margin:5px;width:95%}button{padding:11px;background:#138f86;color:white;border:0;border-radius:8px;margin:5px;cursor:pointer}pre{white-space:pre-wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}</style><main><h1>RiverSSAI • Motif, Harmony & Form Engine</h1><p>Generatore compositivo procedurale sperimentale: tema, armonia, forma e variazioni. Non è ancora un modello AI.</p><section class="card"><div class="grid"><div><label>Brief / scena</label><input id="brief" value="Tema cinematografico di scoperta e speranza"></div><div><label>Emozione</label><select id="mood"><option value="hope">Speranza / meraviglia</option><option value="dark">Oscura / misteriosa</option><option value="triumph">Trionfale</option><option value="sad">Malinconica</option><option value="calm">Calma</option></select></div><div><label>Tonalità</label><select id="key"><option value="C">Do</option><option value="D">Re</option><option value="Eb">Mi♭</option><option value="F">Fa</option><option value="G">Sol</option><option value="A">La</option><option value="Bb">Si♭</option></select></div><div><label>BPM</label><input type="number" id="bpm" value="100" min="40" max="220"></div><div><label>Battute</label><input type="number" id="bars" value="16" min="4" max="128" step="4"></div><div><label>Modo</label><select id="mode"><option value="major">Maggiore</option><option value="minor">Minore</option></select></div></div><button id="gen">Genera struttura e tema</button><button id="play">▶ Riproduci tema</button><button id="stop">■ Stop</button><button id="export">Esporta JSON</button></section><section class="card"><h2>Forma</h2><pre id="form">Genera per iniziare.</pre></section><section class="card"><h2>Motivo melodico</h2><pre id="motif"></pre></section><section class="card"><h2>Armonia</h2><pre id="harmony"></pre></section><section class="card"><h2>Progetto</h2><pre id="json"></pre></section></main><script>const semis={C:0,D:2,Eb:3,F:5,G:7,A:9,Bb:10};const scaleMaj=[0,2,4,5,7,9,11],scaleMin=[0,2,3,5,7,8,10];let project=null,ctx=null,stopped=false;const noteName=n=>['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'][((n%12)+12)%12]+Math.floor(n/12-1);function build(){let key=document.querySelector('#key').value,root=semis[key],minor=document.querySelector('#mode').value==='minor',scale=minor?scaleMin:scaleMaj,mood=document.querySelector('#mood').value,bars=+document.querySelector('#bars').value,bpm=+document.querySelector('#bpm').value;let prog=mood==='dark'||minor?[0,5,3,6]:mood==='sad'?[0,3,5,4]:mood==='calm'?[0,4,0,5]:[0,4,5,3];let degreeChords=prog.map(d=>[d,(d+2)%7,(d+4)%7]);let chordNames=degreeChords.map(ds=>ds.map(d=>noteName(root+scale[d]+60)).join('-'));let seed=[0,2,4,2,1,3,4,6];if(mood==='dark')seed=[0,1,3,2,0,4,3,1];if(mood==='sad')seed=[4,3,2,1,2,0,1,0];if(mood==='calm')seed=[0,2,1,2,4,2,1,0];let motif=seed.map((d,i)=>({beat:i,degree:d,pitch:root+60+scale[d],note:noteName(root+60+scale[d]),duration:1}));let sec=Math.max(1,Math.floor(bars/4)),forms=[];let labels=['A • Tema','B • Sviluppo','C • Intensificazione','D • Finale'];for(let i=0;i<sec;i++){let label=labels[Math.min(i,3)],variation=i===0?'presentazione':i===1?'variazione ritmica e sequenza':i===2?'registro e densità aumentati':'risoluzione e coda';forms.push({section:label,bars:Math.min(4,bars-i*4),variation,progression:chordNames[i%4]})}project={brief:document.querySelector('#brief').value,mood,key,mode:minor?'minor':'major',bpm,bars,form:forms,motif, harmony:chordNames,limitations:'Procedural draft: melody and chord sequence are illustrative, not a full arrangement, AI inference or notation-validated composition.'};document.querySelector('#form').textContent=forms.map(x=>x.section+' ('+x.bars+' battute)\n'+x.variation+'\nAccordi: '+x.progression).join('\n\n');document.querySelector('#motif').textContent=motif.map(x=>x.beat+': '+x.note+' (grado '+x.degree+')').join('  •  ');document.querySelector('#harmony').textContent=chordNames.join('  |  ');document.querySelector('#json').textContent=JSON.stringify(project,null,2)}function stop(){stopped=true;if(ctx){ctx.close();ctx=null}}async function play(){if(!project)build();stop();stopped=false;ctx=new(window.AudioContext||window.webkitAudioContext)();let tempo=project.bpm,base=project.motif;for(let i=0;i<base.length;i++){if(stopped)break;let t=ctx.currentTime+i*60/tempo;let osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='triangle';osc.frequency.value=440*Math.pow(2,(base[i].pitch-69)/12);gain.gain.setValueAtTime(.001,t);gain.gain.linearRampToValueAtTime(.14,t+.03);gain.gain.exponentialRampToValueAtTime(.001,t+.48);osc.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+.5)}setTimeout(()=>{if(ctx&&!stopped)stop()},base.length*60000/tempo+800)}document.querySelector('#gen').onclick=build;document.querySelector('#play').onclick=play;document.querySelector('#stop').onclick=stop;document.querySelector('#export').onclick=()=>{if(!project)build();let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(project,null,2)],{type:'application/json'}));a.download='river-motif-harmony-project.json';a.click()};</script></main></html>
