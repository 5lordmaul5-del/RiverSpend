<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverSSAI • Music Intelligence</title><style>body{margin:0;background:#101820;color:#eaf5f7;font:16px system-ui}main{max-width:1100px;margin:auto;padding:22px}h1{color:#65d8d0}.card{background:#1a2b36;border:1px solid #35505e;border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}input,select,textarea{width:100%;box-sizing:border-box;background:#0d1720;color:white;border:1px solid #426070;padding:10px;border-radius:7px;margin:5px 0}button{background:#16988e;color:white;border:0;padding:11px;border-radius:8px;margin:8px 4px;cursor:pointer}pre{white-space:pre-wrap}</style><main><h1>RiverSSAI • Music Intelligence Planner</h1><p>Architettura di richiesta → struttura musicale → piano compositivo, con revisione e contratto dati per il futuro runtime AI.</p><div class="card"><h2>Brief creativo</h2><div class="grid"><div><label>Richiesta</label><textarea id="prompt" rows="4" placeholder="Descrivi la musica da creare..."></textarea></div><div><label>Output</label><select id="output"><option>Colonna sonora</option><option>Canzone con testo</option><option>Orchestra a fiato</option><option>Orchestra sinfonica</option><option>Musica ambient</option><option>Videogioco</option></select><label>Emozione</label><input id="emotion" placeholder="Epica, nostalgia, tensione..."></div><div><label>Durata</label><input id="duration" value="3 minuti"><label>Tempo</label><input id="tempo" value="moderato / variabile"><label>Stile (riferimento descrittivo)</label><input id="style" placeholder="Descrivi caratteristiche, non copiare brani"></div></div><label>Vincoli / preferenze</label><textarea id="constraints" rows="3"></textarea><button id="build">Costruisci piano compositivo</button></div><div class="card"><h2>Pipeline compositiva</h2><div id="pipeline"></div></div><div class="card"><h2>Progetto musicale strutturato</h2><pre id="out">Il piano sarà visualizzato qui.</pre><button id="export">Esporta JSON</button></div></main><script>let plan=null;const stages=[["Interpretazione","Estrarre scena, emozione, genere, durata e vincoli."],["Forma","Proporre introduzione, temi, sezioni, transizioni e finale."],["Motivi","Definire cellule melodiche, sviluppo e variazioni."],["Armonia","Progettare progressioni, cadenze e tonalità/modalità."],["Orchestrazione","Assegnare voci, tessiture, transposizioni e ruoli."],["Ritmo","Pulsazione, groove, tempi, metri e dinamiche."],["Partitura","Preparare score multi-voce e parti separate."],["Render","Preparare playback, MIDI/MusicXML e audio (runtime futuro)."],["Verifica","Controllare ranges, coerenza, durata, ripetizioni e review."]];document.querySelector("#pipeline").innerHTML=stages.map((s,i)=>'<div style="border:1px solid #385567;border-radius:9px;padding:12px;margin:7px 0"><b>'+String(i+1).padStart(2,"0")+' · '+s[0]+'</b><p>'+s[1]+'</p></div>').join("");document.querySelector("#build").onclick=()=>{plan={request:document.querySelector("#prompt").value,output:document.querySelector("#output").value,emotion:document.querySelector("#emotion").value,duration:document.querySelector("#duration").value,tempo:document.querySelector("#tempo").value,styleDescription:document.querySelector("#style").value,constraints:document.querySelector("#constraints").value,pipeline:stages.map((s,i)=>({step:i+1,name:s[0],description:s[1],status:"planned"})),humanReviewRequired:true,aiRuntimeConnected:false,prototype:true};document.querySelector("#out").textContent=JSON.stringify(plan,null,2)};document.querySelector("#export").onclick=()=>{if(!plan)document.querySelector("#build").click();let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(plan,null,2)],{type:"application/json"}));a.download="river-music-intelligence-plan.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></main></html>
