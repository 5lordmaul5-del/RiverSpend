<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverRender Monitor</title><style>body{font-family:system-ui;background:#101820;color:#f4f8fa;padding:16px}main{max-width:1000px;margin:auto}section{background:#263846;border-radius:12px;padding:15px;margin:12px 0}input,select,button{padding:9px;margin:5px;border-radius:8px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #516575}pre{white-space:pre-wrap}</style><main><h1>RiverRender Job Monitor</h1><p>RC245 · Monitor prototype</p><section><h3>Register planned job</h3><input id="name" placeholder="Job / shot name"><select id="status"><option>Queued</option><option>Simulated</option><option>Completed (manual)</option><option>Failed (manual)</option></select><button id="add">Add entry</button><button id="export">Export JSON</button></section><section><h3>Summary</h3><p id="stats"></p></section><section><h3>Job list</h3><div id="table"></div></section><p>Prototype data is local to this browser session. Not connected to render workers, telemetry, persistence or execution.</p></main><script>let jobs=[];function render(){let counts={};jobs.forEach(j=>counts[j.status]=(counts[j.status]||0)+1);document.getElementById('stats').textContent=JSON.stringify(counts);document.getElementById('table').innerHTML=jobs.length?'<table><thead><tr><th>ID</th><th>Job</th><th>Status</th></tr></thead><tbody>'+jobs.map(j=>'<tr><td>'+j.id+'</td><td>'+j.name.replace(/[<>]/g,'')+'</td><td>'+j.status+'</td></tr>').join('')+'</tbody></table>':'No jobs registered';}document.getElementById('add').onclick=()=>{jobs.push({id:'monitor-'+(jobs.length+1),name:document.getElementById('name').value||'Unnamed',status:document.getElementById('status').value,recordedAt:new Date().toISOString()});render()};document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify({schema:'river-render-monitor-v1',jobs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='river-render-monitor.json';a.click();URL.revokeObjectURL(a.href)};render();</script></main></html>
