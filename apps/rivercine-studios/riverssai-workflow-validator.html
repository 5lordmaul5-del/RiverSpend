<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverSSAI Workflow Validator</title><style>body{background:#101820;color:#eaf5f7;font:16px system-ui;margin:0}main{max-width:900px;margin:auto;padding:24px}h1{color:#65d8d0}textarea{width:100%;box-sizing:border-box;min-height:240px;background:#0d1720;color:white;border:1px solid #426070;border-radius:8px;padding:12px}button{background:#16988e;color:white;border:0;border-radius:8px;padding:12px;margin:8px 0}.card{background:#1a2b36;padding:16px;border-radius:12px;margin:14px 0}li{margin:8px}</style><main><h1>RiverSSAI Workflow Validator</h1><p>Controllo statico dei workflow esportati: ID duplicati, dipendenze mancanti, dipendenze circolari, campi obbligatori e review gates.</p><div class="card"><textarea id="src" placeholder="Incolla qui il workflow JSON..."></textarea><button id="check">Verifica workflow</button><div id="result"></div></div><script>document.querySelector("#check").onclick=()=>{let r=document.querySelector("#result");try{let d=JSON.parse(document.querySelector("#src").value),w=d.workflow;if(!Array.isArray(w))throw Error("workflow deve essere un array");let errs=[],ids=new Set();for(const t of w){if(!t.id||!t.module||!t.task)errs.push("Campi base mancanti in un task");if(ids.has(t.id))errs.push("ID duplicato: "+t.id);ids.add(t.id)}for(const t of w)for(const dep of (t.dependencies||[]))if(!w.some(x=>x.module===dep||x.id===dep))errs.push("Dipendenza non risolta per "+t.id+": "+dep);let graph=new Map(w.map(t=>[t.id,(t.dependencies||[]).map(dep=>w.find(x=>x.module===dep||x.id===dep)?.id).filter(Boolean)])),vis=new Set(),stack=new Set();function dfs(n){if(stack.has(n))return true;if(vis.has(n))return false;vis.add(n);stack.add(n);for(const x of graph.get(n)||[]){if(dfs(x))return true}stack.delete(n);return false}for(const n of graph.keys())if(dfs(n)){errs.push("Ciclo rilevato nelle dipendenze");break}r.innerHTML=errs.length?"<b>Issues:</b><ul>"+errs.map(x=>"<li>"+x+"</li>").join("")+"</ul>":"<b>Workflow valido nei controlli statici.</b> "+w.length+" task rilevati. Nessuna esecuzione avviata."; }catch(e){r.textContent="JSON o schema non leggibile: "+e.message}};</script></main></html>
