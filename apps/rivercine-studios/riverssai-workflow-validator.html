<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RiverSSAI Workflow Validator</title>
<style>
body{background:#101820;color:#eaf5f7;font:16px system-ui;margin:0}main{max-width:900px;margin:auto;padding:24px}h1{color:#65d8d0}textarea{width:100%;box-sizing:border-box;min-height:240px;background:#0d1720;color:white;border:1px solid #426070;border-radius:8px;padding:12px}button{background:#16988e;color:white;border:0;border-radius:8px;padding:12px;margin:8px 0}.card{background:#1a2b36;padding:16px;border-radius:12px;margin:14px 0}li{margin:8px}.status{white-space:pre-wrap}
</style>
<main><h1>RiverSSAI Workflow Validator</h1>
<p>Controllo statico: struttura, campi, ID, dipendenze, ambiguità e cicli. Non esegue task.</p>
<div class="card"><textarea id="src" placeholder="Incolla qui il workflow JSON..."></textarea><button id="check">Verifica workflow</button><div id="result" class="status" role="status" aria-live="polite"></div></div>
<script>
const result=document.querySelector("#result");
document.querySelector("#check").addEventListener("click",()=>{
 result.replaceChildren();
 try {
  const data=JSON.parse(document.querySelector("#src").value);
  if(!data||typeof data!=="object"||Array.isArray(data)) throw Error("Il JSON deve contenere un oggetto.");
  const tasks=data.workflow;
  if(!Array.isArray(tasks)) throw Error("workflow deve essere un array.");
  const errors=[], warnings=[], idMap=new Map(), moduleMap=new Map();
  tasks.forEach((t,i)=>{
   if(!t||typeof t!=="object"||Array.isArray(t)){errors.push("Task #"+(i+1)+" non è un oggetto.");return;}
   for(const key of ["id","module","task"]) if(typeof t[key]!=="string"||!t[key].trim()) errors.push("Task #"+(i+1)+": campo "+key+" mancante o non valido.");
   if(typeof t.id==="string"&&t.id.trim()){if(idMap.has(t.id))errors.push("ID duplicato: "+t.id);else idMap.set(t.id,i);}
   if(typeof t.module==="string"&&t.module.trim()){if(!moduleMap.has(t.module))moduleMap.set(t.module,[]);moduleMap.get(t.module).push(i);}
   if(t.dependencies!==undefined&&!Array.isArray(t.dependencies)) errors.push("Dependencies deve essere un array nel task "+(t.id||("#"+(i+1)))+".");
   else if(Array.isArray(t.dependencies)&&t.dependencies.some(d=>typeof d!=="string"||!d.trim())) errors.push("Dipendenze devono essere stringhe non vuote nel task "+(t.id||("#"+(i+1)))+".");
  });
  for(const [mod,idxs] of moduleMap) if(idxs.length>1) warnings.push("Modulo '"+mod+"' assegnato a più task: usa ID espliciti nelle dipendenze per evitare ambiguità.");
  const resolve=(dep)=>{
   if(idMap.has(dep))return idMap.get(dep);
   const matches=moduleMap.get(dep)||[];
   if(matches.length===1)return matches[0];
   return null;
  };
  const graph=new Map();
  tasks.forEach((t,i)=>{
   if(!t||typeof t!=="object"||Array.isArray(t))return;
   const edges=[];
   if(Array.isArray(t.dependencies))t.dependencies.forEach(dep=>{
    const target=resolve(dep);
    if(target===null){errors.push("Dipendenza non risolta o ambigua nel task "+(t.id||("#"+(i+1)))+": "+dep);}
    else edges.push(target);
   });
   graph.set(i,edges);
  });
  const state=new Map(),cycleNodes=new Set();
  function visit(n,path){
   if(state.get(n)===1){path.slice(path.indexOf(n)).forEach(x=>cycleNodes.add(x));cycleNodes.add(n);return;}
   if(state.get(n)===2)return;
   state.set(n,1);path.push(n);
   for(const next of graph.get(n)||[])visit(next,path);
   path.pop();state.set(n,2);
  }
  for(const n of graph.keys())visit(n,[]);
  if(cycleNodes.size)errors.push("Ciclo nelle dipendenze rilevato coinvolgendo: "+[...cycleNodes].map(i=>tasks[i]?.id||("#"+(i+1))).join(", "));
  const heading=document.createElement("strong");
  heading.textContent=errors.length?"Problemi rilevati:":"Controlli statici superati.";
  result.append(heading);
  const list=document.createElement("ul");
  for(const message of [...errors,...warnings]){const li=document.createElement("li");li.textContent=message;list.append(li);}
  if(errors.length||warnings.length)result.append(list);
  const summary=document.createElement("p");
  summary.textContent=errors.length? "Workflow non valido. "+tasks.length+" task analizzati. Nessuna esecuzione avviata.":"Workflow valido nei controlli statici. "+tasks.length+" task analizzati. Nessuna esecuzione avviata.";
  result.append(summary);
 }catch(e){result.textContent="JSON o struttura non leggibile: "+e.message;}
});
</script></main></html>
