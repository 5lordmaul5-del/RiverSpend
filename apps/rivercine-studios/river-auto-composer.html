<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverSSAI • Auto Composer</title><style>body{background:#101820;color:#eaf5f7;font:16px system-ui;margin:0}main{max-width:1050px;margin:auto;padding:22px}h1{color:#65d8d0}.card{background:#1a2b36;border:1px solid #35505e;border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}input,select,textarea{width:100%;box-sizing:border-box;background:#0d1720;color:white;border:1px solid #426070;padding:10px;border-radius:7px;margin:5px 0}button{background:#16988e;color:white;border:0;padding:11px;border-radius:8px;margin:7px 4px;cursor:pointer}pre{white-space:pre-wrap}.notes{display:flex;flex-wrap:wrap;gap:5px}.note{padding:8px;background:#245c68;border-radius:6px}</style><main><h1>RiverSSAI • Auto Composer</h1><p>Descrivi la musica che desideri. Questo prototype genera una bozza melodica con parametri creativi ed esporta MIDI/JSON. Generazione demo non connessa al runtime RiverSSAI.</p><div class="card"><div class="grid"><div><label>Richiesta musicale</label><textarea id="prompt" rows="4" placeholder="Musica epica per una scena spaziale..."></textarea></div><div><label>Tipo</label><select id="kind"><option>Film score</option><option>Canzone</option><option>Orchestra a fiato</option><option>Ambient</option><option>Marcia</option><option>Videogioco</option></select><label>Atmosfera</label><select id="mood"><option>Epic</option><option>Sad</option><option>Joyful</option><option>Suspense</option><option>Peaceful</option><option>Triumphant</option></select><label>Tempo BPM</label><input id="bpm" type="number" value="100"></div><div><label>Durata (battute)</label><select id="bars"><option>8</option><option>16</option><option>32</option><option>64</option></select><label>Tonalità</label><select id="key"><option>C major</option><option>G major</option><option>D major</option><option>F major</option><option>A minor</option><option>E minor</option><option>D minor</option></select><label>Organico</label><select id="inst"><option>Full cinematic orchestra</option><option>Wind band</option><option>Solo piano</option><option>Strings</option><option>Synth and ambient</option><option>Rock band</option></select></div></div><button id="create">✨ Genera composizione demo</button></div><div class="card"><h2>Bozza melodica</h2><div id="score" class="notes"></div><button id="play">▶ Play demo</button><button id="midi">Export MIDI</button><button id="json">Export JSON</button><pre id="info"></pre></div></main><script>let composition=null;const scales={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10]};function create(){let mood=document.querySelector("#mood").value,kind=document.querySelector("#kind").value,bars=+document.querySelector("#bars").value,bpm=+document.querySelector("#bpm").value,key=document.querySelector("#key").value;let scale=key.toLowerCase().includes("minor")?scales.minor:scales.major,base=key.startsWith("A")?57:key.startsWith("E")?52:key.startsWith("D")?50:key.startsWith("F")?53:key.startsWith("G")?55:60;let seed=(mood+kind+document.querySelector("#prompt").value).split("").reduce((a,c)=>a+c.charCodeAt(0),0);let count=Math.min(bars*4,256),notes=[];for(let i=0;i<count;i++){seed=(seed*1664525+1013904223)>>>0;let deg=scale[(seed>>>8)%scale.length];let octave=(i%16<8?0:12);let rest=(mood==="Suspense"&&i%7===0);notes.push(rest?null:base+deg+octave)}composition={prompt:document.querySelector("#prompt").value,kind,mood,bpm,bars,key,instrumentation:document.querySelector("#inst").value,notes,prototypeAlgorithm:"seeded scale-based motif demo",runtimeConnected:false};document.querySelector("#score").innerHTML=notes.map(n=>'<span class="note">'+(n===null?"Rest":name(n))+'</span>').join("");document.querySelector("#info").textContent=JSON.stringify({...composition,notes:notes.slice(0,24)},null,2)}function name(n){return ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"][n%12]+(Math.floor(n/12)-1)}document.querySelector("#create").onclick=create;document.querySelector("#play").onclick=async()=>{if(!composition)create();let ctx=new(window.AudioContext||window.webkitAudioContext)(),dur=60/composition.bpm;for(let n of composition.notes.slice(0,64)){if(n!==null){let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=440*Math.pow(2,(n-69)/12);g.gain.value=.08;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur*.75)}await new Promise(r=>setTimeout(r,dur*1000))}ctx.close()};document.querySelector("#json").onclick=()=>{if(!composition)create();dl(JSON.stringify(composition,null,2),"river-auto-composition.json","application/json")};function dl(data,n,t){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.querySelector("#midi").onclick=()=>{if(!composition)create();let ticks=480,track=[];let us=60000000/composition.bpm;track.push(0,255,81,3,(us>>16)&255,(us>>8)&255,us&255);function vlq(v){let b=[v&127];while(v>>=7)b.unshift((v&127)|128);return b}let last=0;composition.notes.forEach((n,i)=>{let t=i*ticks;if(n!==null){track.push(...vlq(t-last),144,n,85);last=t;track.push(...vlq(ticks),128,n,0);last=t+ticks}else{track.push(...vlq(t-last),0);last=t}});track.push(0,255,47,0);let d=[77,84,104,100,0,0,0,6,0,0,0,1,1,224,77,84,114,107,(track.length>>24)&255,(track.length>>16)&255,(track.length>>8)&255,track.length&255,...track];dl(new Uint8Array(d),"river-auto-composition.mid","audio/midi")};</script></main></html>
