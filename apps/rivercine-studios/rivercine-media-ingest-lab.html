<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverCine Media Ingest</title><style>body{margin:0;background:#111b24;color:#eef4f8;font:16px system-ui}header{background:#17404a;padding:22px}main{max-width:1100px;margin:auto;padding:18px}.card{background:#192b36;border:1px solid #3c5665;border-radius:12px;padding:15px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}input,select,button{background:#142530;color:inherit;border:1px solid #4a6272;border-radius:8px;padding:10px;font:inherit}button{cursor:pointer}.muted{color:#9db2bf}pre{white-space:pre-wrap}</style><header><h1>RiverCine Media Pipeline</h1><p>RC239 · Ingest, Proxy & Color Metadata</p></header><main><p class="muted">Prototipo di catalogazione media e pianificazione ingest. Non copia, transcodifica o genera proxy.</p><div class="card"><h2>Registra media</h2><div class="grid"><input id="name" placeholder="Nome clip / file"><input id="path" placeholder="Percorso / URI asset"><input id="duration" placeholder="Durata (es. 00:01:24)"><input id="tc" placeholder="Timecode iniziale"><select id="resolution"><option>3840×2160</option><option>1920×1080</option><option>1280×720</option><option>Altro / non noto</option></select><select id="fps"><option>24</option><option>23.976</option><option>25</option><option>29.97</option><option>30</option><option>50</option><option>59.94</option><option>Altro</option></select><select id="color"><option>Da identificare</option><option>Rec.709</option><option>Rec.2020</option><option>ACES</option><option>Log (specificare nelle note)</option><option>HDR (specificare nelle note)</option></select><select id="proxy"><option>Proxy non creato</option><option>ProRes Proxy · quarter</option><option>ProRes Proxy · half</option><option>H.264 · quarter</option><option>H.264 · half</option></select><input id="notes" placeholder="Note, codec, audio, metadata"></div><button onclick="add()">Registra clip</button></div><h2>Media catalog</h2><div id="list"></div><div class="card"><h2>Ingest plan</h2><select id="action"><option>Keep original / reference</option><option>Copy media</option><option>Transcode (planned)</option><option>Create proxies (planned)</option><option>Copy + proxy (planned)</option></select><p class="muted">Il piano registra l'intenzione; non avvia jobs.</p><button onclick="exportData()">Esporta manifest JSON</button><button onclick="check()">Controllo metadata</button><pre id="report"></pre></div></main><script>let media=[];function add(){let name=document.getElementById('name').value.trim();if(!name)return;media.push({id:'media-'+(media.length+1),name,path:document.getElementById('path').value,duration:document.getElementById('duration').value,timecodeStart:document.getElementById('tc').value,frameSize:document.getElementById('resolution').value,frameRate:document.getElementById('fps').value,colorTag:document.getElementById('color').value,proxyPlan:document.getElementById('proxy').value,notes:document.getElementById('notes').value,status:'metadata-only'});render()}function remove(i){media.splice(i,1);render()}function render(){document.getElementById('list').innerHTML=media.map((m,i)=>'<div class="card"><h3>'+esc(m.name)+'</h3><p>Path: '+esc(m.path||'—')+' · '+esc(m.frameSize)+' · '+esc(m.frameRate)+' fps</p><p>Color: '+esc(m.colorTag)+' · Proxy: '+esc(m.proxyPlan)+'</p><p>Timecode: '+esc(m.timecodeStart||'—')+' · Duration: '+esc(m.duration||'—')+'</p><p>'+esc(m.notes||'')+'</p><button onclick="remove('+i+')">Rimuovi</button></div>').join('')||'<p>Nessun media registrato.</p>'}function check(){let missing=media.filter(m=>!m.path||m.colorTag==='Da identificare'||m.frameRate==='Altro');document.getElementById('report').textContent='Media registrati: '+media.length+'\nMetadata da completare: '+missing.length+'\n'+missing.map(m=>'• '+m.name).join('\n')+'\n\nQuesto è un controllo semplice dei campi, non un verifica tecnica dei file.'}function exportData(){let d={schemaVersion:'1.0',product:'RiverCine Media Pipeline',ingestPlan:document.getElementById('action').value,assets:media};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='rivercine-media-manifest.json';a.click();URL.revokeObjectURL(a.href)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render()</script></main></html>
