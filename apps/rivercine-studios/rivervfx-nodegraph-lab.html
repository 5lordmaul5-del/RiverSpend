<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverVFX Node Graph</title><style>body{margin:0;background:#101820;color:#eef4f8;font:16px system-ui}header{padding:24px;background:#173944}main{max-width:1100px;margin:auto;padding:20px}button,input,select{padding:10px;border-radius:8px;background:#192b37;color:inherit;border:1px solid #466172}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{border:1px solid #395361;background:#172630;border-radius:12px;padding:14px}.nodes{display:flex;gap:10px;flex-wrap:wrap}.node{width:210px;border-left:4px solid #79c5c7}.muted{color:#a6bac4}pre{white-space:pre-wrap}</style></head><body><header><h1>RiverVFX · Node Graph Blueprint</h1><p>RC238 — Compositing graph planning prototype</p></header><main><p class="muted">Prototipo per modellare una pipeline a nodi. I nodi sono descrittivi e non elaborano immagini o video.</p><section class="card"><h2>Aggiungi nodo</h2><div class="grid"><select id="type"><option>Source / Plate</option><option>Transform</option><option>Mask / Roto</option><option>Tracking Data</option><option>Color Transform</option><option>Key / Matte</option><option>Depth / Z</option><option>FX Element</option><option>Blend / Composite</option><option>Output</option></select><input id="label" placeholder="Nome nodo / scopo"><button onclick="add()">Aggiungi</button></div></section><h2>Graph</h2><div id="nodes" class="nodes"></div><section class="card"><h2>Collega nodi</h2><div class="grid"><select id="from"></select><select id="to"></select><button onclick="connect()">Crea connessione</button></div><div id="edges"></div></section><button onclick="exportGraph()">Esporta Graph JSON</button><pre id="report"></pre></main><script>let nodes=[],edges=[];function add(){let t=document.getElementById('type').value,l=document.getElementById('label').value.trim()||t;nodes.push({id:'n'+(nodes.length+1),type:t,label:l,params:{},inputs:[]});document.getElementById('label').value='';render()}function connect(){let a=document.getElementById('from').value,b=document.getElementById('to').value;if(!a||!b||a===b)return;edges.push({from:a,to:b});render()}function del(i){nodes.splice(i,1);edges=edges.filter(e=>nodes.some(n=>n.id===e.from)&&nodes.some(n=>n.id===e.to));render()}function render(){document.getElementById('nodes').innerHTML=nodes.map((n,i)=>'<article class="card node"><h3>'+esc(n.label)+'</h3><p>'+esc(n.type)+'</p><small>ID: '+n.id+'</small><p><button onclick="del('+i+')">Rimuovi</button></p></article>').join('')||'<p>Nessun nodo.</p>';let opts=nodes.map(n=>'<option value="'+n.id+'">'+esc(n.id+' · '+n.label)+'</option>').join('');document.getElementById('from').innerHTML=opts;document.getElementById('to').innerHTML=opts;document.getElementById('edges').innerHTML='<h3>Connessioni</h3>'+edges.map(e=>'<p>'+esc(e.from)+' → '+esc(e.to)+'</p>').join('');document.getElementById('report').textContent=edges.length+' connessioni · '+nodes.length+' nodi (solo metadata)'}function exportGraph(){let data={schemaVersion:'1.0',product:'RiverVFX',graph:{nodes,edges}};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='rivervfx-nodegraph.json';a.click();URL.revokeObjectURL(a.href)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render()</script></main></body></html>
