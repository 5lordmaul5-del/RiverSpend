<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISSA MultiTrack</title><style>body{margin:0;background:#071923;color:#eaf7fa;font:15px system-ui}header{padding:20px;background:linear-gradient(110deg,#103849,#087b88);border-bottom:2px solid #d7b35c}main{padding:16px;max-width:1200px;margin:auto}.panel,.track{background:#102c3b;border:1px solid #2b5866;border-radius:12px;padding:12px;margin:10px 0}button{background:#30bec5;border:0;border-radius:9px;padding:9px 12px;margin:4px;font-weight:bold}button.secondary{background:#345765;color:white}.tracks{overflow:auto}.track{display:grid;grid-template-columns:220px minmax(500px,1fr);gap:12px;align-items:center}.lane{height:60px;background:repeating-linear-gradient(90deg,#0b3a4a 0,#0b3a4a 99px,#155063 100px);border-radius:8px;overflow:hidden}.clip{margin:7px;height:46px;background:#27a9b2;border:1px solid #9ce5e7;border-radius:7px;display:flex;align-items:center;padding:6px;overflow:hidden;white-space:nowrap}.status{color:#b6e8e8}.small{font-size:12px;color:#a8c7d0}</style><header><h1>🎚️ River ISSA MultiTrack</h1><p>Editor prototipo: tracce sincronizzate, import, mute, gain</p></header><main><div class="panel"><button id="add">＋ Aggiungi traccia</button><button id="play">▶ Play</button><button id="stop" class="secondary">■ Stop</button><button id="export" class="secondary">Export progetto JSON</button><label>Tempo (BPM) <input id="bpm" type="number" min="30" max="300" value="120"></label><p class="status" id="status">Importa audio sulle tracce; il progetto rimane locale nel browser.</p><small>Playback allineato semplice; demo senza mix/render WAV.</small></div><div id="tracks" class="tracks"></div></main><script>const tracks=[];let playing=false;const $=x=>document.getElementById(x);function addTrack(){let t={id:tracks.length+1,name:"Traccia "+(tracks.length+1),file:null,url:null,duration:0,muted:false,gain:1,audio:null};tracks.push(t);render()}function render(){let root=$("tracks");root.innerHTML="";tracks.forEach(t=>{let el=document.createElement("div");el.className="track";let info=document.createElement("div");info.innerHTML="<b>"+t.name+"</b><br><small>"+(t.file?t.file.name:"Nessun file audio")+"</small>";let file=document.createElement("input");file.type="file";file.accept="audio/*";file.onchange=e=>{let f=e.target.files[0];if(!f)return;t.file=f;t.url=URL.createObjectURL(f);let a=new Audio(t.url);a.onloadedmetadata=()=>{t.duration=a.duration;render()};t.audio=a;render()};info.append(file);let mute=document.createElement("button");mute.textContent=t.muted?"Unmute":"Mute";mute.className="secondary";mute.onclick=()=>{t.muted=!t.muted;render()};info.append(mute);let gain=document.createElement("label");gain.textContent="Gain ";let g=document.createElement("input");g.type="range";g.min=0;g.max=1;g.step=.01;g.value=t.gain;g.oninput=()=>{t.gain=+g.value;if(t.audio)t.audio.volume=t.muted?0:t.gain};gain.append(g);info.append(gain);let lane=document.createElement("div");lane.className="lane";if(t.url){let clip=document.createElement("div");clip.className="clip";clip.style.width=Math.max(8,(t.duration||1)*20)+"px";clip.textContent=t.file.name;lane.append(clip)}el.append(info,lane);root.append(el)})}$("add").onclick=addTrack;addTrack();addTrack();function stop(){playing=false;tracks.forEach(t=>{if(t.audio){t.audio.pause();t.audio.currentTime=0}});$("status").textContent="Fermato."}$("play").onclick=()=>{if(playing)return;let loaded=tracks.filter(t=>t.audio);if(!loaded.length){$("status").textContent="Importa almeno un file audio.";return}playing=true;loaded.forEach(t=>{t.audio.currentTime=0;t.audio.volume=t.muted?0:t.gain;t.audio.play().catch(()=>{})});$("status").textContent="Riproduzione in corso."};$("stop").onclick=stop;$("export").onclick=()=>{let data={schema:"riverissa.multitrack.project.v1",bpm:+$("bpm").value,tracks:tracks.map(t=>({id:t.id,name:t.name,fileName:t.file?.name||null,duration:t.duration,muted:t.muted,gain:t.gain,assetIncluded:false}))};let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="river-issa-project.json";a.click();$("status").textContent="Metadata esportata; audio non incorporato."};</script></html>
