<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#13b9c8"><meta name="description" content="RiverMail, la posta del mondo RiverSpend"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>RiverMail</title><style>
:root{font-family:system-ui,sans-serif;color:#152b36;background:#eefafa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(130deg,#10b9c8,#087b99);color:white;padding:22px 18px;border-radius:0 0 25px 25px}header h1{margin:0;font-size:28px}header p{margin:4px 0}.wrap{max-width:850px;margin:auto;padding:16px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btn{border:0;border-radius:12px;padding:11px 14px;background:#0b839b;color:white;font-weight:700;cursor:pointer}.btn.alt{background:white;color:#087b99;border:1px solid #c5e7ed}.search{width:100%;padding:12px;border:1px solid #c8e4e9;border-radius:12px}.list{display:grid;gap:10px}.mail{background:white;padding:14px;border-radius:14px;box-shadow:0 2px 9px #1231;cursor:pointer}.mail small{color:#58727b}.mail p{margin:6px 0}.panel{background:white;border-radius:15px;padding:16px;margin:12px 0}.hidden{display:none}footer{text-align:center;color:#68838b;padding:24px}.badge{font-size:12px;background:#fff4d9;color:#75520a;border-radius:8px;padding:5px 8px}label{display:block;margin:8px 0}input,textarea{width:100%;padding:10px;border:1px solid #c5e7ed;border-radius:10px}textarea{min-height:110px}@media(min-width:600px){.list{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>🌊 RiverMail</h1><p>Your mail. Your flow.</p></header><main class="wrap"><div class="panel"><span class="badge">DEMO · nessun invio reale</span><p>Prototipo installabile. La connessione al server email reale verrà aggiunta successivamente.</p><button id="install" class="btn hidden">Installa RiverMail</button></div><div class="bar"><button class="btn" id="inboxBtn">📥 Inbox</button><button class="btn alt" id="composeBtn">✉️ Nuova email</button><button class="btn alt" id="archiveBtn">📦 Archivio</button><button class="btn alt" id="trashBtn">🗑️ Cestino</button></div><input id="search" class="search" placeholder="Cerca nelle email demo…"><section id="inbox" class="list"></section><section id="compose" class="panel hidden"><h2>Nuova email</h2><label>Destinatario<input id="to" type="email"></label><label>Oggetto<input id="subject"></label><label>Messaggio<textarea id="body"></textarea></label><button class="btn" id="send">Salva nella demo</button><button class="btn alt" id="cancel">Annulla</button></section><section id="view" class="panel hidden"></section></main><footer>RiverSpend · RiverMail · RC220 prototype</footer><script>
const sample=[{id:1,from:"RiverSpend",subject:"Benvenuto in RiverMail",body:"Benvenuto nel prototipo RiverMail.",date:"Oggi",folder:"inbox",read:false},{id:2,from:"RiverSSAI",subject:"Connessione prevista",body:"Il collegamento ai moduli RiverSSAI sarà aggiunto con API sicure.",date:"Ieri",folder:"inbox",read:true},{id:3,from:"RiverSpendShop",subject:"Notifiche Shop",body:"Le notifiche marketplace saranno configurabili.",date:"Ieri",folder:"archive",read:true}];let messages=JSON.parse(localStorage.getItem("rm-demo")||"null")||sample;let folder="inbox";const inbox=document.getElementById("inbox"),view=document.getElementById("view"),compose=document.getElementById("compose");function save(){localStorage.setItem("rm-demo",JSON.stringify(messages))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function render(){view.classList.add("hidden");compose.classList.add("hidden");inbox.classList.remove("hidden");let q=document.getElementById("search").value.toLowerCase();inbox.innerHTML=messages.filter(m=>m.folder===folder&&(m.from+m.subject+m.body).toLowerCase().includes(q)).map(m=>'<article class="mail" data-id="'+m.id+'"><strong>'+(!m.read?'● ':'')+esc(m.from)+'</strong><p>'+esc(m.subject)+'</p><small>'+esc(m.date)+'</small></article>').join("")||'<div class="panel">Nessun messaggio.</div>';inbox.querySelectorAll(".mail").forEach(el=>el.onclick=()=>openMail(+el.dataset.id))}function openMail(id){let m=messages.find(x=>x.id===id);if(!m)return;m.read=true;save();inbox.classList.add("hidden");view.classList.remove("hidden");view.innerHTML='<button class="btn alt" id="back">← Indietro</button><h2>'+esc(m.subject)+'</h2><p><strong>'+esc(m.from)+'</strong> · '+esc(m.date)+'</p><p>'+esc(m.body).replace(/\n/g,"<br>")+'</p><div class="bar"><button class="btn alt" id="archive">Archivia</button><button class="btn alt" id="delete">Cestina</button></div>';document.getElementById("back").onclick=render;document.getElementById("archive").onclick=()=>{m.folder="archive";save();render()};document.getElementById("delete").onclick=()=>{m.folder="trash";save();render()}}document.getElementById("inboxBtn").onclick=()=>{folder="inbox";render()};document.getElementById("archiveBtn").onclick=()=>{folder="archive";render()};document.getElementById("trashBtn").onclick=()=>{folder="trash";render()};document.getElementById("search").oninput=render;document.getElementById("composeBtn").onclick=()=>{inbox.classList.add("hidden");view.classList.add("hidden");compose.classList.remove("hidden")};document.getElementById("cancel").onclick=render;document.getElementById("send").onclick=()=>{messages.unshift({id:Date.now(),from:"Bozza invio (demo)",subject:document.getElementById("subject").value||"(senza oggetto)",body:"A: "+document.getElementById("to").value+"\n"+document.getElementById("body").value,date:"Ora",folder:"inbox",read:false});save();alert("Salvato localmente: non inviato.");render()};let deferred;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;document.getElementById("install").classList.remove("hidden")});document.getElementById("install").onclick=async()=>{if(deferred){deferred.prompt();deferred=null}};if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});render();</script></body></html>
