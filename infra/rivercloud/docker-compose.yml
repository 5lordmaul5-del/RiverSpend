services:
  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      RIVERCLOUD_DOMAIN: ${RIVERCLOUD_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [rivercloud]
    depends_on: [rivercloud-demo]
  rivercloud-demo:
    image: traefik/whoami:v1.12.0
    restart: unless-stopped
    command: ["--port=8080"]
    expose:
      - "8080"
    networks: [rivercloud]
    # The minimal whoami image does not contain wget/curl; avoid a false failing healthcheck.
    # Example app only; replace with app services when configuring deployments.
networks:
  rivercloud:
    name: rivercloud
volumes:
  caddy_data:
  caddy_config:
