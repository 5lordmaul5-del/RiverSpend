services:
  caddy:
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      RIVERCLOUD_DOMAIN: ${RIVERCLOUD_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      rivercloud:
        ipv4_address: 172.30.250.2
    depends_on:
      - oauth2-proxy
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${RIVERCLOUD_OIDC_ISSUER_URL}
      OAUTH2_PROXY_CLIENT_ID: ${RIVERCLOUD_OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${RIVERCLOUD_OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${RIVERCLOUD_OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: https://${RIVERCLOUD_DOMAIN}/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: ${RIVERCLOUD_OIDC_EMAIL_DOMAINS}
      OAUTH2_PROXY_ALLOWED_GROUPS: ${RIVERCLOUD_OIDC_ALLOWED_GROUPS}
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: ${RIVERCLOUD_OIDC_GROUPS_CLAIM}
      OAUTH2_PROXY_SCOPE: "openid email profile groups"
      OAUTH2_PROXY_UPSTREAMS: http://rivercloud-demo:8080/
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_TRUSTED_PROXY_IPS: 172.30.250.2/32
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
    networks:
      rivercloud:
        ipv4_address: 172.30.250.3
    depends_on:
      - rivercloud-demo
  rivercloud-demo:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
    restart: unless-stopped
    command: ["--port=8080"]
    expose:
      - "8080"
    networks:
      rivercloud:
        ipv4_address: 172.30.250.4
    # Placeholder upstream only; never publish this container directly.
networks:
  rivercloud:
    name: rivercloud
    ipam:
      config:
        - subnet: 172.30.250.0/24
volumes:
  caddy_data:
  caddy_config:
