<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverMail RC217</title><style>body{margin:0;background:#eaf8f7;color:#183137;font:16px system-ui}header{text-align:center;background:#bdeeed;padding:24px}main{max-width:900px;margin:auto;padding:15px}.p{background:white;padding:16px;margin:12px 0;border-radius:16px;box-shadow:0 2px 12px #0001}button,input,textarea{padding:10px;border-radius:10px;border:1px solid #bed8d7;font:inherit}button{cursor:pointer;background:#e2f7f5}.m{padding:12px;border-bottom:1px solid #eee;cursor:pointer}.un{font-weight:bold}.muted{font-size:13px;color:#657c80}</style><header><h1>🌊 RiverMail</h1>Your mailbox • Your flow</header><main><div class="p"><strong>📥 Inbox　🔗 Shop　💬 Signals　🧠 RiverSSAI　🛡️ Shield</strong><p class="muted">Prototype demo — not real email delivery.</p><input id="q" placeholder="Search..." oninput="render()" style="width:95%"></div><div class="p"><h3>Compose demo</h3><input id="to" placeholder="Recipient" style="width:95%"><br><br><input id="sub" placeholder="Subject" style="width:95%"><br><br><textarea id="body" rows="3" placeholder="Message" style="width:95%"></textarea><br><button onclick="compose()">Save draft</button></div><div class="p"><h3>Inbox</h3><div id="inbox"></div></div><div class="p"><h3>Ecosystem integrations</h3><button onclick="add('RiverSpendShop')">Shop event</button> <button onclick="add('RiverSpaceSignals')">Signals notification</button> <button onclick="add('RiverSSAI')">RiverSSAI alert</button></div></main><script>let a=[{from:'RiverSpendShop',s:'Demo order #RS-104',b:'Order and shipping updates.',u:true},{from:'RiverSpaceSignals',s:'Demo message',b:'Simulated Signals notification.',u:true},{from:'RiverSSAI',s:'Demo report',b:'Sample RiverSSAI summary.',u:false}];function render(){let q=document.getElementById('q').value.toLowerCase();document.getElementById('inbox').innerHTML=a.filter(x=>(x.from+x.s+x.b).toLowerCase().includes(q)).map((x,i)=>'<div class="m '+(x.u?'un':'')+'" onclick="openm('+i+')">'+x.from+' • '+x.s+'<div class="muted">'+x.b+'</div></div>').join('')}function openm(i){a[i].u=false;alert(a[i].from+'\n'+a[i].s+'\n\n'+a[i].b);render()}function compose(){let to=document.getElementById('to').value,s=document.getElementById('sub').value,b=document.getElementById('body').value;if(!to||!s||!b){alert('Fill in all fields');return}a.unshift({from:'Draft to '+to,s,b,u:true});render();alert('Saved in demo only — not sent.')}function add(app){a.unshift({from:app,s:'Demo ecosystem notification',b:'Simulated event received from River ecosystem.',u:true});render()}render()</script></html>
