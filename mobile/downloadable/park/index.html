<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05a9c6"><meta name="description" content="Esplora il mondo RiverSpend Park e le sue esperienze digitali."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>RiverSpendPark</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px;background:linear-gradient(150deg,#c8f5fb,#eefcff);font-family:system-ui,sans-serif;color:#12313b;display:grid;place-items:center}.card{width:min(100%,500px);background:white;border-radius:28px;padding:26px;box-shadow:0 16px 44px #16445120}.logo{width:76px;height:76px;border-radius:22px;background:#00a9c4;color:white;display:grid;place-items:center;font-weight:900}h1{margin:20px 0 5px;font-size:2rem}p{line-height:1.55;color:#49636c}button,a{border:0;border-radius:14px;background:#087e96;color:white;padding:14px 18px;font-weight:700;display:inline-block;text-decoration:none;margin:6px 5px 0 0}small{color:#657c84}.install{display:none}</style></head><body><main class="card"><div class="logo">PARK</div><h1>RiverSpendPark</h1><p>Esplora il mondo RiverSpend Park e le sue esperienze digitali.</p><button class="install" id="install">Installa app</button><a href="https://www.riverspend.com/">RiverSpend</a><p><small>Starter installabile · demo · non ancora collegato ai servizi reali.</small></p></main><script>let deferred;const b=document.getElementById('install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;b.style.display='inline-block'});b.addEventListener('click',async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;b.style.display='none'}});if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
