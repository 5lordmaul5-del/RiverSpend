<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d9fb3"><title>RiverUpdate · RiverSpend</title><style>body{margin:0;background:#effafa;color:#17333b;font-family:system-ui}header{padding:24px;background:linear-gradient(120deg,#12c5d4,#087c98);color:white;border-radius:0 0 24px 24px}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #1242}select,button{padding:10px 14px;border-radius:10px;border:1px solid #cde6eb;background:white;color:#087c98;font-weight:700}button{cursor:pointer}.tag{display:inline-block;padding:4px 9px;border-radius:8px;background:#e4f7f9;color:#087c98;font-size:12px;font-weight:700}.muted{color:#66818a;font-size:14px}ul{padding-left:20px}</style></head><body><header><h1>🌊 RiverUpdate</h1><p>Il centro aggiornamenti RiverSpend</p></header><main class="wrap"><div class="card"><p class="muted">Registry dimostrativo pubblico. In questa fase visualizza i metadati; non installa automaticamente software nativo.</p><label for="channel">Canale di aggiornamento:</label> <select id="channel"><option value="stable">Stable</option><option value="beta">Beta</option><option value="alpha">Alpha</option></select></div><div id="apps"></div></main><script>async function load(){const res=await fetch("./registry.json",{cache:"no-store"});if(!res.ok)throw Error("Registry non disponibile");const data=await res.json();const render=()=>{const c=document.getElementById("channel").value;document.getElementById("apps").innerHTML=data.apps.map(a=>{const release=a[c];return '<section class="card"><h2>'+a.name+'</h2><span class="tag">'+(release?c.toUpperCase():"Nessuna release "+c)+'</span><p><strong>Versione:</strong> '+(release?release.version:"—")+'</p>'+(release&&release.url?'<p><a href="'+release.url+'">Apri applicazione</a></p>':'')+(a.notes&&a.notes.length?'<ul>'+a.notes.map(n=>'<li>'+n+'</li>').join("")+'</ul>':'')+'</section>'}).join("")};document.getElementById("channel").onchange=render;render()}load().catch(e=>document.getElementById("apps").textContent=e.message);</script></body></html>
