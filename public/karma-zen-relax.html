<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#092b35">
<link rel="manifest" href="/karma-zen-relax.webmanifest">
<link rel="icon" type="image/png" href="/icons/karma-zen-relax.svg">
<link rel="apple-touch-icon" href="/icons/karma-zen-relax.svg">
<title>Karma Zen Relax · RiverSpaceSignals × ISSA</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#164b54,#071a25 65%);color:#f5f1e6;font-family:system-ui,-apple-system,sans-serif;padding:calc(62px + env(safe-area-inset-top)) 16px 32px}
.back{position:fixed;z-index:5;top:env(safe-area-inset-top);left:0;right:0;height:56px;display:flex;align-items:center;padding:0 16px;background:#082e38;border-bottom:1px solid #c6a45c55}.back a{color:#f2d38a;text-decoration:none;font-weight:750;border:1px solid #c6a45c;border-radius:999px;padding:9px 15px}
main{max-width:620px;margin:auto}.brand{text-align:center;padding:20px 0}.brand img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 0 18px #d5b66b55)}.eyebrow{color:#d8bd7b;letter-spacing:.2em;font-size:11px;font-weight:800}.brand h1{font-size:clamp(30px,8vw,42px);margin:8px 0 4px}.brand h1 span{color:#e4c47d}.brand p{color:#c4d5d5;line-height:1.5;margin:0}.panel{background:#ffffff0d;border:1px solid #d7c18b55;border-radius:24px;padding:18px;box-shadow:0 18px 60px #0005}.now{display:flex;align-items:center;gap:14px;margin-bottom:18px}.orb{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#fff2c9,#bd9851 35%,#173d48 75%);color:#09232b;font-size:25px;box-shadow:0 0 24px #d8bd7b55}.now h2{font-size:18px;margin:0 0 4px}.now p{font-size:12px;color:#b8cbcb;margin:0}.tracks{display:grid;gap:9px}.track{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:13px;border:1px solid #d6c18b44;border-radius:15px;background:#071f2a;color:#f5f1e6;cursor:pointer}.track.active{border-color:#e6c77e;background:#173b40}.num{color:#dfc17d;font-weight:800;font-size:13px}.track strong{display:block;font-size:14px}.track small{display:block;color:#b6c9c8;font-size:11px;margin-top:3px}.play{margin-left:auto;color:#e8cb85;font-size:18px}.controls{margin-top:18px}.controls audio{width:100%;height:42px}.note{text-align:center;color:#9fb5b5;font-size:11px;margin:16px 0 0}
</style>
</head>
<body>
<header class="back"><a href="https://www.riverspend.com/">← Torna a RiverSpendShop</a></header>
<main>
<header class="brand">
<img src="/icons/karma-zen-relax.svg" alt="RiverSpaceSignals">
<div class="eyebrow">RIVERSPACE SIGNALS · ISSA</div>
<h1>Karma <span>Zen Relax</span></h1>
<p>Uno spazio sonoro immersivo per rallentare, respirare e ritrovare equilibrio.</p>
</header>
<section class="panel" aria-label="Lettore Karma Zen Relax">
<div class="now"><div class="orb" aria-hidden="true">〰</div><div><h2 id="currentTitle">Scegli una traccia</h2><p>Immersive Sound Space Ambient · RiverSpend</p></div></div>
<div class="tracks" id="tracks">
<button class="track" data-src="https://riversignals-7xr64gfcw-mauryle75-8055s-projects.vercel.app/audio/01-tibetan-monks.mp3" data-title="Tibetan Monks"><span class="num">01</span><span><strong>Tibetan Monks</strong><small>Voce e atmosfera meditativa</small></span><span class="play">▶</span></button>
<button class="track" data-src="https://riversignals-7xr64gfcw-mauryle75-8055s-projects.vercel.app/audio/02-tibetan-bowl.mp3" data-title="Tibetan Singing Bowl"><span class="num">02</span><span><strong>Tibetan Singing Bowl</strong><small>Campane tibetane · meditazione</small></span><span class="play">▶</span></button>
<button class="track" data-src="https://riversignals-7xr64gfcw-mauryle75-8055s-projects.vercel.app/audio/03-bianzhong-bell.mp3" data-title="Bianzhong Bell"><span class="num">03</span><span><strong>Bianzhong Bell</strong><small>Risonanza di campana</small></span><span class="play">▶</span></button>
<button class="track" data-src="https://riversignals-7xr64gfcw-mauryle75-8055s-projects.vercel.app/audio/04-tibetan-bowl-ambient.mp3" data-title="Tibetan Bowl Ambient"><span class="num">04</span><span><strong>Tibetan Bowl Ambient</strong><small>Atmosfera sonora avvolgente</small></span><span class="play">▶</span></button>
<button class="track" data-src="https://riversignals-7xr64gfcw-mauryle75-8055s-projects.vercel.app/audio/05-himalayan-bowls-1.mp3" data-title="Himalayan Bowls I"><span class="num">05</span><span><strong>Himalayan Bowls I</strong><small>Risonanze himalayane</small></span><span class="play">▶</span></button>
<button class="track" data-src="https://riversignals-7xr64gfcw-mauryle75-8055s-projects.vercel.app/audio/06-himalayan-bowls-2.mp3" data-title="Himalayan Bowls II"><span class="num">06</span><span><strong>Himalayan Bowls II</strong><small>Suoni profondi e distensivi</small></span><span class="play">▶</span></button>
</div>
<div class="controls"><audio id="player" controls preload="none"></audio></div>
<p class="note">L'audio parte solo quando scegli una traccia. Usa i comandi per pausa e volume.</p>
</section>
</main>
<script>
const player=document.getElementById('player'),title=document.getElementById('currentTitle');
document.querySelectorAll('.track').forEach(button=>button.addEventListener('click',async()=>{
 document.querySelectorAll('.track').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-pressed','false')});
 button.classList.add('active');button.setAttribute('aria-pressed','true');
 title.textContent=button.dataset.title;
 if(player.src!==button.dataset.src){player.src=button.dataset.src}
 try{await player.play()}catch(e){title.textContent=button.dataset.title+' · premi play per ascoltare'}
}));
</script>
</body></html>
