<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Unità RS2 UFO BOX — concept RiverSpend</title><desc id="desc">Disco volante di consegna con sei rotori interni, contenitore centrale e quattro stabilizzatori di atterraggio estraibili.</desc>
<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#06172c"/><stop offset="1" stop-color="#087f9e"/></linearGradient><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#fff9e7"/><stop offset=".5" stop-color="#b8c8d2"/><stop offset="1" stop-color="#657a8c"/></linearGradient><linearGradient id="gold" x2="1" y2="1"><stop stop-color="#fff0a3"/><stop offset=".5" stop-color="#d9a52b"/><stop offset="1" stop-color="#8b5a11"/></linearGradient><radialGradient id="glow"><stop stop-color="#b8ffff"/><stop offset=".45" stop-color="#00d9ff"/><stop offset="1" stop-color="#006080"/></radialGradient><filter id="shadow"><feGaussianBlur stdDeviation="12"/></filter></defs>
