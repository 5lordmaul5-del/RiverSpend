<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Karma Zen Relax, loto in movimento</title><desc id="desc">Loto dorato rotante al centro di un lago notturno, luna luminosa, acqua animata e due onde energetiche a forma di S.</desc>
<defs>
