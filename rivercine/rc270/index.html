<!doctype html>
<html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverCine RC270 Sync Studio</title>
<style>
body{font-family:system-ui;background:#101722;color:#eaf2fa;margin:0;padding:18px}h1{color:#6ee7d8}button,input{padding:8px;border-radius:8px;border:1px solid #506070;background:#182435;color:#fff}button{cursor:pointer;margin:3px}.track{border:1px solid #44556a;border-radius:12px;padding:12px;margin:12px 0;background:#172230}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.wave{width:100%;height:75px;background:#0b121b;border-radius:8px}.small{font-size:12px;color:#aab8c6}.meter{height:5px;background:#334455;margin-top:6px}
</style><body>
<h1>🎚️ RiverCine RC270 — Sync Multitrack Studio</h1><p class="small">Timeline comune · playback sincronizzato · volume/pan reali · progetto locale · export mix WAV</p>
<div class="row"><button id="add">＋ Traccia</button><button id="play">▶ Play progetto</button><button id="stop">■ Stop</button><button id="save">💾 Salva progetto</button><button id="load">↩ Recupera</button><button id="export">⬇ Esporta mix WAV</button><input type="file" id="file" accept=".json" hidden></div>
<p id="status" class="small">Aggiungi una traccia e registra con il microfono (richiede HTTPS/localhost).</p><div id="tracks"></div>
<script>
const tracks=[], el=document.querySelector('#tracks');let ctx=null,playNodes=[],startedAt=0;
const audioCtx=()=>ctx||(ctx=new (window.AudioContext||window.webkitAudioContext)());
function msg(s){document.querySelector('#status').textContent=s}
function addTrack(name='Traccia '+(tracks.length+1)){const t={name,blob:null,buffer:null,volume:1,pan:0};tracks.push(t);render()}
function render(){el.innerHTML='';tracks.forEach((t,i)=>{const d=document.createElement('div');d.className='track';d.innerHTML='<div class="row"><input class="name" value="'+esc(t.name)+'" style="flex:1"><span class="small">'+(t.buffer?Math.round(t.buffer.duration*10)/10+' s':'nessun audio')+'</span><button class="rec">● Registra</button><button class="stoprec">■</button><button class="listen">▶</button><button class="del">✕</button></div><div class="row"><label>Volume <input class="vol" type="range" min="0" max="2" step=".01" value="'+t.volume+'"></label><label>Pan <input class="pan" type="range" min="-1" max="1" step=".01" value="'+t.pan+'"></label><label>Offset (s) <input class="off" type="number" min="0" step=".01" value="0" style="width:70px"></label><button class="upload">Importa audio</button></div><canvas class="wave" width="900" height="75"></canvas><input class="audiofile" type="file" accept="audio/*" hidden>';el.append(d);
d.querySelector('.name').onchange=e=>t.name=e.target.value;d.querySelector('.vol').oninput=e=>t.volume=+e.target.value;d.querySelector('.pan').oninput=e=>t.pan=+e.target.value;
d.querySelector('.del').onclick=()=>{tracks.splice(i,1);render()};d.querySelector('.upload').onclick=()=>d.querySelector('.audiofile').click();
d.querySelector('.audiofile').onchange=async e=>{const f=e.target.files[0];if(f){t.blob=f;t.buffer=await audioCtx().decodeAudioData(await f.arrayBuffer());draw(t,d.querySelector('canvas'));render();msg('Audio importato nella traccia '+(i+1))}};
d.querySelector('.rec').onclick=()=>record(t,d);d.querySelector('.stoprec').onclick=()=>t.recorder?.stop();d.querySelector('.listen').onclick=()=>playOne(t);
if(t.buffer)draw(t,d.querySelector('canvas'))})}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function draw(t,c){const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.strokeStyle='#65d8c5';g.beginPath();const data=t.buffer.getChannelData(0),step=Math.max(1,Math.floor(data.length/c.width));for(let x=0;x<c.width;x++){let a=0;for(let k=0;k<step;k++)a=Math.max(a,Math.abs(data[x*step+k]||0));g.moveTo(x,37-a*35);g.lineTo(x,37+a*35)}g.stroke()}
async function record(t,box){try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const mr=new MediaRecorder(stream);t.recorder=mr;let chunks=[];mr.ondataavailable=e=>chunks.push(e.data);mr.onstop=async()=>{t.blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});t.buffer=await audioCtx().decodeAudioData(await t.blob.arrayBuffer());stream.getTracks().forEach(x=>x.stop());render();msg('Registrazione completata')};mr.start();msg('Registrazione in corso…')}catch(e){msg('Microfono non disponibile: '+e.message)}}
function makeChain(c,t){const src=c.createBufferSource(),gain=c.createGain(),pan=c.createStereoPanner();src.buffer=t.buffer;gain.gain.value=t.volume;pan.pan.value=t.pan;src.connect(gain).connect(pan).connect(c.destination);return {src,gain,pan}}
function stopAll(){playNodes.forEach(n=>{try{n.stop()}catch(e){}});playNodes=[]}
async function playProject(){if(!tracks.some(t=>t.buffer)){msg('Importa o registra audio prima.');return}stopAll();const c=audioCtx();await c.resume();const start=c.currentTime+.08;tracks.forEach(t=>{if(!t.buffer)return;const n=makeChain(c,t);n.src.start(start,0);playNodes.push(n)});startedAt=start;msg('Playback sincronizzato avviato (tutte le tracce partono insieme).')}
async function playOne(t){if(!t.buffer)return;const c=audioCtx();await c.resume();stopAll();const n=makeChain(c,t);n.src.start(c.currentTime+.03);playNodes.push(n)}
function wavBlob(buf){const n=buf.numberOfChannels,len=buf.length* n*2+44,b=new ArrayBuffer(len),v=new DataView(b);let p=0;const write=(s)=>{for(let i=0;i<s.length;i++)v.setUint8(p++,s.charCodeAt(i))};write('RIFF');v.setUint32(p, len-8,true);p+=4;write('WAVE');write('fmt ');v.setUint32(p,16,true);p+=4;v.setUint16(p,1,true);p+=2;v.setUint16(p,n,true);p+=2;v.setUint32(p,buf.sampleRate,true);p+=4;v.setUint32(p,buf.sampleRate*n*2,true);p+=4;v.setUint16(p,n*2,true);p+=2;v.setUint16(p,16,true);p+=2;write('data');v.setUint32(p,len-44,true);p+=4;for(let i=0;i<buf.length;i++)for(let ch=0;ch<n;ch++){let x=Math.max(-1,Math.min(1,buf.getChannelData(ch)[i]));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([b],{type:'audio/wav'})}
async function exportMix(){const usable=tracks.filter(t=>t.buffer);if(!usable.length)return msg('Nessuna traccia da esportare');const rate=usable[0].buffer.sampleRate,dur=Math.max(...usable.map(t=>t.buffer.duration)),off=new OfflineAudioContext(2,Math.ceil(dur*rate),rate);usable.forEach(t=>{const s=off.createBufferSource(),g=off.createGain(),p=off.createStereoPanner();s.buffer=t.buffer;g.gain.value=t.volume;p.pan.value=t.pan;s.connect(g).connect(p).connect(off.destination);s.start(0)});msg('Rendering mix WAV…');const rendered=await off.startRendering(),blob=wavBlob(rendered),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='RiverCine-RC270-mix.wav';a.click();msg('Mix WAV esportato.')}
async function save(){const data=[];for(const t of tracks)data.push({name:t.name,volume:t.volume,pan:t.pan,audio:t.blob?await blob64(t.blob):null});localStorage.setItem('rc270',JSON.stringify(data));msg('Progetto salvato localmente nel browser.')}
function blob64(b){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}
async function load(){try{const data=JSON.parse(localStorage.getItem('rc270')||'[]');tracks.splice(0);for(const x of data){const t={name:x.name,volume:x.volume,pan:x.pan,blob:null,buffer:null};if(x.audio){t.blob=dataBlob(x.audio);t.buffer=await audioCtx().decodeAudioData(await t.blob.arrayBuffer())}tracks.push(t)}render();msg('Progetto recuperato dal salvataggio locale.')}catch(e){msg('Recupero fallito: '+e.message)}}
function dataBlob(s){const [meta,b64]=s.split(',');const bin=atob(b64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:meta.match(/:(.*?);/)[1]})}
document.querySelector('#add').onclick=()=>addTrack();document.querySelector('#play').onclick=playProject;document.querySelector('#stop').onclick=stopAll;document.querySelector('#save').onclick=save;document.querySelector('#load').onclick=load;document.querySelector('#export').onclick=exportMix;
addTrack('Voce');addTrack('Chitarra');addTrack('Basso');
</script></body></html>
