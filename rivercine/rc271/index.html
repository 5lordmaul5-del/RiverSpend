<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverCine RC271 Timeline</title><style>
body{background:#101722;color:#eaf2fa;font-family:system-ui;margin:0;padding:16px}h1{color:#66dec9}.track{background:#172536;border:1px solid #42576b;border-radius:12px;padding:12px;margin:12px 0}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,input{background:#213449;color:#fff;border:1px solid #5a7084;border-radius:8px;padding:7px}button{cursor:pointer}.lane{position:relative;height:66px;background:#0a111a;border-radius:8px;margin:8px 0;overflow-x:auto}.clip{position:absolute;height:42px;top:10px;background:#138e85;border:2px solid #74e1d0;border-radius:8px;min-width:12px;display:flex;align-items:center;padding:0 8px;overflow:hidden;white-space:nowrap;cursor:grab}.small{color:#aab9c7;font-size:12px}.label{min-width:85px}
</style><body><h1>🎬 RC271 — RiverCine Timeline Editor</h1><p class="small">Import audio · trim start/end · position clips · fades · undo/redo · synchronized mix export</p>
<div class="row"><button id="add">＋ Traccia</button><button id="play">▶ Play</button><button id="stop">■ Stop</button><button id="undo">↶ Undo</button><button id="redo">↷ Redo</button><button id="save">💾 Salva</button><button id="load">↩ Recupera</button><button id="export">⬇ Export WAV</button><label>Zoom <input id="zoom" type="range" min="20" max="120" value="50"></label></div><p id="status" class="small">Timeline in secondi. Importa un file audio per aggiungere un clip.</p><div id="tracks"></div>
<script>
const tracks=[];let ctx=null,nodes=[],history=[],future=[],zoom=50;const root=document.querySelector('#tracks');const ac=()=>ctx||(ctx=new (window.AudioContext||window.webkitAudioContext)());function status(s){document.querySelector('#status').textContent=s}
function snap(){history.push(JSON.stringify(tracks.map(t=>({...t,blob:null,buffer:null}))));if(history.length>30)history.shift();future=[]}
function add(name='Traccia '+(tracks.length+1)){snap();tracks.push({name,clip:null});render()}
function render(){root.innerHTML='';tracks.forEach((t,i)=>{let d=document.createElement('div');d.className='track';d.innerHTML='<div class="row"><input class="name" value="'+escapeH(t.name)+'"><button class="import">Importa audio</button><button class="del">Elimina</button></div><div class="lane"><div class="clip"></div></div><div class="row small"><label>Posizione (s) <input class="pos" type="number" step=".05" min="0" value="'+(t.clip?.pos||0)+'"></label><label>Trim in (s) <input class="tin" type="number" step=".01" min="0" value="'+(t.clip?.tin||0)+'"></label><label>Trim out (s) <input class="tout" type="number" step=".01" min="0" value="'+(t.clip?.tout??(t.clip?.buffer?.duration||0))+'"></label><label>Fade in (s) <input class="fi" type="number" step=".05" min="0" value="'+(t.clip?.fi||0)+'"></label><label>Fade out (s) <input class="fo" type="number" step=".05" min="0" value="'+(t.clip?.fo||0)+'"></label><label>Volume <input class="vol" type="range" min="0" max="2" step=".01" value="'+(t.clip?.vol??1)+'"></label><label>Pan <input class="pan" type="range" min="-1" max="1" step=".01" value="'+(t.clip?.pan||0)+'"></label></div><input class="file" type="file" accept="audio/*" hidden>';root.append(d);
d.querySelector('.name').onchange=e=>{snap();t.name=e.target.value};d.querySelector('.del').onclick=()=>{snap();tracks.splice(i,1);render()};d.querySelector('.import').onclick=()=>d.querySelector('.file').click();d.querySelector('.file').onchange=async e=>{let f=e.target.files[0];if(!f)return;snap();let buffer=await ac().decodeAudioData(await f.arrayBuffer());t.clip={buffer,blob:f,pos:0,tin:0,tout:buffer.duration,fi:0,fo:0,vol:1,pan:0};render()};
['pos','tin','tout','fi','fo','vol','pan'].forEach(k=>{d.querySelector('.'+k).onchange=e=>{snap();if(t.clip)t.clip[k]=+e.target.value;render()}});let c=d.querySelector('.clip'),lane=d.querySelector('.lane');if(t.clip){let cl=t.clip, length=Math.max(0,cl.tout-cl.tin),left=cl.pos*zoom,width=Math.max(length*zoom,12);c.style.left=left+'px';c.style.width=width+'px';c.textContent=t.name+' · '+length.toFixed(2)+'s';lane.style.minWidth=Math.max(900,(cl.pos+length+2)*zoom)+'px';c.onpointerdown=e=>{let start=e.clientX,orig=cl.pos;c.setPointerCapture(e.pointerId);c.onpointermove=ev=>{let p=Math.max(0,orig+(ev.clientX-start)/zoom);cl.pos=p;c.style.left=p*zoom+'px'};c.onpointerup=()=>{snap();c.onpointermove=null;render()}}}}
)}
function escapeH(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function stop(){nodes.forEach(n=>{try{n.stop()}catch{}});nodes=[]}
function schedule(c,t,when,offline=false){if(!t.clip)return;let cl=t.clip,buf=cl.buffer;if(!buf)return;let duration=Math.max(0,cl.tout-cl.tin);if(duration<=0)return;let s=c.createBufferSource(),g=c.createGain(),p=c.createStereoPanner();s.buffer=buf;g.gain.setValueAtTime(cl.vol,when);if(cl.fi>0){g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(cl.vol,when+Math.min(cl.fi,duration))}if(cl.fo>0){g.gain.setValueAtTime(cl.vol,Math.max(when,when+duration-cl.fo));g.gain.linearRampToValueAtTime(0,when+duration)}p.pan.value=cl.pan;s.connect(g).connect(p).connect(c.destination);s.start(when+cl.pos,cl.tin,duration);nodes.push(s)}
async function play(){stop();let c=ac();await c.resume();let base=c.currentTime+.1;tracks.forEach(t=>schedule(c,t,base));status('Playback timeline sincronizzato.')}
function serialize(){return tracks.map(t=>({name:t.name,clip:t.clip?{pos:t.clip.pos,tin:t.clip.tin,tout:t.clip.tout,fi:t.clip.fi,fo:t.clip.fo,vol:t.clip.vol,pan:t.clip.pan,audio:null}:null}))}
async function save(){let out=[];for(let t of tracks){let item={name:t.name,clip:null};if(t.clip){let blob=t.clip.blob||new Blob([]);item.clip={pos:t.clip.pos,tin:t.clip.tin,tout:t.clip.tout,fi:t.clip.fi,fo:t.clip.fo,vol:t.clip.vol,pan:t.clip.pan,audio:await to64(blob)}}out.push(item)}localStorage.setItem('rc271',JSON.stringify(out));status('Progetto salvato nel browser (quota storage limitata).')}
function to64(b){return new Promise(resolve=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(b)})}
function from64(s){let [m,b]=s.split(','),raw=atob(b),u=new Uint8Array(raw.length);for(let i=0;i<u.length;i++)u[i]=raw.charCodeAt(i);return new Blob([u],{type:m.match(/:(.*?);/)[1]})}
async function load(){try{let data=JSON.parse(localStorage.getItem('rc271')||'[]');tracks.splice(0);for(let x of data){let t={name:x.name,clip:null};if(x.clip?.audio){let blob=from64(x.clip.audio),buffer=await ac().decodeAudioData(await blob.arrayBuffer());t.clip={...x.clip,blob,buffer}}tracks.push(t)}render();status('Progetto recuperato.')}catch(e){status('Errore recupero: '+e.message)}}
function undo(){if(!history.length)return;future.push(JSON.stringify(serialize()));let h=history.pop();tracks.splice(0,...JSON.parse(h).map(t=>({name:t.name,clip:null})));render();status('Undo: per i clip audio la cronologia completa resta limitata.')}
function redo(){status('Redo non ancora ripristina gli audio completi: funzione placeholder.')}
async function exportMix(){let usable=tracks.filter(t=>t.clip);if(!usable.length)return status('Nessun clip da esportare.');let rate=usable[0].clip.buffer.sampleRate,end=Math.max(...usable.map(t=>t.clip.pos+t.clip.tout-t.clip.tin)),offline=new OfflineAudioContext(2,Math.ceil(end*rate),rate);usable.forEach(t=>{let cl=t.clip,s=offline.createBufferSource(),g=offline.createGain(),p=offline.createStereoPanner(),dur=cl.tout-cl.tin;s.buffer=cl.buffer;g.gain.setValueAtTime(cl.vol,cl.pos);if(cl.fi>0){g.gain.setValueAtTime(0,cl.pos);g.gain.linearRampToValueAtTime(cl.vol,cl.pos+Math.min(cl.fi,dur))}if(cl.fo>0){g.gain.setValueAtTime(cl.vol,cl.pos+dur-cl.fo);g.gain.linearRampToValueAtTime(0,cl.pos+dur)}p.pan.value=cl.pan;s.connect(g).connect(p).connect(offline.destination);s.start(cl.pos,cl.tin,dur)});status('Rendering WAV…');let b=await offline.startRendering();let wav=wavEncode(b),a=document.createElement('a');a.href=URL.createObjectURL(wav);a.download='RiverCine-RC271-mix.wav';a.click();status('Mix esportato.')}
function wavEncode(buf){let n=buf.numberOfChannels,size=44+buf.length*n*2,ab=new ArrayBuffer(size),v=new DataView(ab),p=0;function str(s){for(let i=0;i<s.length;i++)v.setUint8(p++,s.charCodeAt(i))}str('RIFF');v.setUint32(p,size-8,true);p+=4;str('WAVEfmt ');v.setUint32(p,16,true);p+=4;v.setUint16(p,1,true);p+=2;v.setUint16(p,n,true);p+=2;v.setUint32(p,buf.sampleRate,true);p+=4;v.setUint32(p,buf.sampleRate*n*2,true);p+=4;v.setUint16(p,n*2,true);p+=2;v.setUint16(p,16,true);p+=2;str('data');v.setUint32(p,size-44,true);p+=4;for(let i=0;i<buf.length;i++)for(let ch=0;ch<n;ch++){let x=Math.max(-1,Math.min(1,buf.getChannelData(ch)[i]));v.setInt16(p,x<0?x*32768:x*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'})}
document.querySelector('#add').onclick=()=>add();document.querySelector('#play').onclick=play;document.querySelector('#stop').onclick=stop;document.querySelector('#save').onclick=save;document.querySelector('#load').onclick=load;document.querySelector('#export').onclick=exportMix;document.querySelector('#undo').onclick=undo;document.querySelector('#redo').onclick=redo;document.querySelector('#zoom').oninput=e=>{zoom=+e.target.value;render()};add('Voce');add('Chitarra');add('Basso');
</script></body></html>
