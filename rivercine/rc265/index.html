<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RiverCine — RC265 Mixer</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#e6edf7;font-family:system-ui,Arial;padding:20px}h1{margin:0 0 8px;color:#74d8d0}p{color:#a9b8cb}.bar{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.bar button{background:#174b62;color:white;border:1px solid #408aa1;border-radius:10px;padding:10px;cursor:pointer}.mixer{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.strip{border:1px solid #294257;border-radius:14px;padding:12px;background:#142033;display:flex;flex-direction:column;gap:10px}.strip h3{margin:0}.strip label{font-size:12px;color:#b9c9d9}.strip input[type=range]{width:100%}.buttons{display:flex;gap:6px}.buttons button{flex:1;padding:7px;border:0;border-radius:8px;background:#294257;color:white}.buttons button.on{background:#b34b4b}.meter{height:8px;background:#253649;border-radius:8px;overflow:hidden}.meter span{display:block;height:100%;width:0;background:linear-gradient(90deg,#38a67b,#f0b34a,#e65b5b)}.fx{font-size:12px;min-height:44px;color:#c5d3e1;border-top:1px solid #294257;padding-top:8px}.master{border-color:#c99c40}.notice{border:1px solid #a57934;border-radius:12px;padding:12px;color:#ffe2a5;margin-top:16px}
</style></head><body><h1>RiverCine · Mixer RC265</h1><p>Banco di mixaggio — prototipo UI, controllo simulato</p><div class="bar"><button data-preset="Rock">Rock</button><button data-preset="Heavy Metal">Heavy Metal</button><button data-preset="Acoustic">Acoustic</button><button data-preset="Vocal">Vocal</button><button data-preset="Immersive">Immersive</button><button id="reset">Reset</button></div><div class="mixer" id="mixer"></div><div class="notice"><b>Nota:</b> fader, meter e routing sono simulati. Nessun DSP o ingresso audio reale è collegato in questa demo.</div><script>
const names=['Drums','Bass','Guitar L','Guitar R','Vocals','Keys','Ambience','Master'];let state=names.map((n,i)=>({name:n,level:i===6?-12:0,pan:i===2?-55:i===3?55:0,mute:false,solo:false,fx:i===0?'EQ · Compressor · Room':i===4?'EQ · Compressor · De-esser · Reverb':'EQ · FX'}));const root=document.querySelector('#mixer');function render(){root.innerHTML='';state.forEach((c,i)=>{let s=document.createElement('section');s.className='strip'+(i===7?' master':'');s.innerHTML='<h3>'+c.name+'</h3><div class="meter"><span style="width:'+Math.max(0,Math.min(100,(c.level+60)/60*100))+'%"></span></div><label>Volume: '+c.level+' dB</label><input data-i="'+i+'" data-k="level" type="range" min="-60" max="12" value="'+c.level+'"><label>Pan: '+c.pan+'</label><input data-i="'+i+'" data-k="pan" type="range" min="-100" max="100" value="'+c.pan+'"><div class="buttons"><button data-i="'+i+'" data-k="mute" class="'+(c.mute?'on':'')+'">Mute</button><button data-i="'+i+'" data-k="solo" class="'+(c.solo?'on':'')+'">Solo</button></div><div class="fx">FX: '+c.fx+'</div>';root.appendChild(s)});root.querySelectorAll('input').forEach(el=>el.oninput=()=>{let i=+el.dataset.i,k=el.dataset.k;state[i][k]=+el.value;render()});root.querySelectorAll('button').forEach(el=>el.onclick=()=>{let i=+el.dataset.i,k=el.dataset.k;if(k){state[i][k]=!state[i][k];render()}})}render();document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{let p=b.dataset.preset;state.forEach((c,i)=>{c.level=p==='Heavy Metal'&&i===0?3:p==='Acoustic'&&i===6?-4:i===6?-12:0;c.pan=i===2?-55:i===3?55:0;c.fx=p==='Heavy Metal'?'EQ · Gate · Compressor · FX':p==='Acoustic'?'EQ · Gentle compression · Reverb':'EQ · FX'});render()});document.querySelector('#reset').onclick=()=>{state.forEach(c=>{c.level=0;c.pan=0;c.mute=false;c.solo=false;c.fx='EQ · FX'});render()};
</script></body></html>
