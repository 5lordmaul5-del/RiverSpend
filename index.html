<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>RiverSpend — YOUR SHOP • YOUR FLOW</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #10b7df;
    }

    #opening {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #10b7df;
      z-index: 9999;
      cursor: pointer;
    }

    #opening-image {
      display: block;

      width: 100vw;
      height: 100dvh;

      margin: 0;
      padding: 0;

      object-fit: fill;

      border: 0;
      outline: 0;

      -webkit-tap-highlight-color: transparent;
    }

    #home {
      display: none;
      min-height: 100dvh;
      padding: 30px 20px;
      background: #f5fbfd;
      color: #123;
    }

    #home h1 {
      color: #078fc0;
    }
  </style>
</head>

<body>

  <section id="opening">

    <img
      id="opening-image"
      src="./file_00000000db008246926cc5b0d85ffd53.png"
      alt="RiverSpend — YOUR SHOP • YOUR FLOW"
    >

  </section>

  <main id="home">

    <h1>RiverSpend</h1>

    <p>YOUR SHOP • YOUR FLOW</p>

  </main>

  <script>
    const opening = document.getElementById("opening");
    const image = document.getElementById("opening-image");
    const home = document.getElementById("home");

    opening.addEventListener("click", function () {
      opening.style.display = "none";
      home.style.display = "block";
      document.body.style.overflow = "auto";
    });
  </script>

</body>
</html>
