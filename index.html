<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>RiverSpend — YOUR SHOP • YOUR FLOW</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #063f5c;
    }

    /* =========================
       APERTURA RIVERSPEND
       ========================= */

    #opening {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at 50% 35%,
          #159fc7 0%,
          #087da5 35%,
          #064f70 68%,
          #032f49 100%
        );

      color: white;
      text-align: center;

      z-index: 9999;
    }

    /* effetto acqua */
    #opening::before,
    #opening::after {
      content: "";
      position: absolute;
      left: -10%;
      width: 120%;
      height: 180px;

      border-radius: 50%;

      background: rgba(255,255,255,0.07);

      pointer-events: none;
    }

    #opening::before {
      top: 18%;
      transform: rotate(-4deg);
    }

    #opening::after {
      bottom: 14%;
      transform: rotate(3deg);
    }

    /* =========================
       LOGO
       ========================= */

    .river-logo {
      position: relative;
      z-index: 2;

      font-size: clamp(42px, 13vw, 86px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -3px;

      margin-bottom: 20px;

      text-shadow:
        0 4px 20px rgba(0,0,0,0.25);
    }

    .river-logo .river {
      color: #9deeff;
    }

    .river-logo .spend {
      color: #e5b83d;
    }

    /* doppia onda sotto il logo */

    .waves {
      position: relative;
      z-index: 2;

      width: min(330px, 78vw);
      height: 34px;

      margin-bottom: 25px;
    }

    .waves::before,
    .waves::after {
      content: "";

      position: absolute;
      left: 0;

      width: 100%;
      height: 12px;

      border-top: 3px solid #8de9ff;
      border-radius: 50%;
    }

    .waves::before {
      top: 4px;
      transform: skewX(-18deg);
    }

    .waves::after {
      top: 15px;
      transform: skewX(18deg);
      border-color: #e5b83d;
    }

    /* =========================
       PAYOFF
       ========================= */

    .payoff {
      position: relative;
      z-index: 2;

      font-size: clamp(15px, 4vw, 21px);
      font-weight: 700;
      letter-spacing: 2px;

      margin-bottom: 8px;
    }

    .claim {
      position: relative;
      z-index: 2;

      font-size: clamp(14px, 3.5vw, 18px);
      opacity: 0.9;

      margin-bottom: 38px;
    }

    /* =========================
       ENTRA
       ========================= */

    #enter {
      position: relative;
      z-index: 2;

      border: 1px solid rgba(255,255,255,0.8);

      border-radius: 999px;

      padding: 15px 30px;

      background: rgba(0,55,85,0.65);

      color: white;

      font-size: 16px;
      font-weight: 700;

      letter-spacing: 0.5px;

      cursor: pointer;

      box-shadow:
        0 8px 30px rgba(0,0,0,0.25);

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    #enter:active {
      transform: scale(0.96);
    }

    #enter:hover {
      background: rgba(0,80,115,0.85);
    }

    /* =========================
       HOME TEMPORANEA
       ========================= */

    #home {
      display: none;

      min-height: 100dvh;

      padding: 30px 18px;

      background: #f5fbfd;

      color: #123;
    }

    #home h1 {
      color: #078fc0;
    }
  </style>
</head>

<body>

  <!-- =================================
       UNICA APERTURA
       ================================= -->

  <section id="opening">

    <div class="river-logo">
      <span class="river">River</span><span class="spend">Spend</span>
    </div>

    <div class="waves"></div>

    <div class="payoff">
      YOUR SHOP • YOUR FLOW
    </div>

    <div class="claim">
      Il fiume scorre con te
    </div>

    <button id="enter">
      🌊 ENTRA IN RIVERSPEND
    </button>

  </section>


  <!-- =================================
       PAGINA SUCCESSIVA TEMPORANEA
       ================================= -->

  <main id="home">

    <h1>RiverSpend</h1>

    <p>
      YOUR SHOP • YOUR FLOW
    </p>

  </main>


  <script>
    const enterButton = document.getElementById("enter");
    const opening = document.getElementById("opening");
    const home = document.getElementById("home");

    enterButton.addEventListener("click", function () {

      opening.style.display = "none";
      home.style.display = "block";

    });
  </script>

</body>
</html>
