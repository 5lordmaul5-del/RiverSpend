<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>RiverSpend — YOUR SHOP • YOUR FLOW</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      overflow: hidden;
    }

    /* =========================
       APERTURA RIVERSPEND
       ========================= */

    #opening {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      padding: 0 20px 55px;

      background: #000
        url("./file_00000000c750820b8e168f1087120377.png")
        center center
        / cover
        no-repeat;

      z-index: 9999;
    }

    /* =========================
       PULSANTE ENTRA
       ========================= */

    #enter {
      position: relative;
      z-index: 10;

      min-width: 270px;
      max-width: 90vw;

      padding: 17px 28px;

      border: 1.5px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;

      background: rgba(0, 65, 95, 0.72);

      color: #ffffff;

      font-size: 17px;
      font-weight: 700;

      letter-spacing: 0.5px;

      cursor: pointer;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.35);

      backdrop-filter: blur(5px);

      transition:
        transform 0.2s ease,
        background 0.2s ease;
    }

    #enter:active {
      transform: scale(0.96);
    }

    #enter:hover {
      background: rgba(0, 95, 130, 0.88);
    }

    /* =========================
       HOME TEMPORANEA
       ========================= */

    #home {
      display: none;

      width: 100%;
      min-height: 100dvh;

      padding: 35px 20px;

      background: #f4fbfd;

      color: #123;
    }

    #home h1 {
      margin: 0 0 18px;

      font-size: 38px;

      color: #078fbf;
    }

    #home p {
      margin: 0;

      font-size: 18px;
    }
  </style>
</head>

<body>

  <!-- =========================
       APERTURA
       ========================= -->

  <section id="opening">

    <button id="enter">
      🌊 ENTRA IN RIVERSPEND
    </button>

  </section>


  <!-- =========================
       PAGINA SUCCESSIVA
       TEMPORANEA
       ========================= -->

  <main id="home">

    <h1>RiverSpend</h1>

    <p>
      YOUR SHOP • YOUR FLOW
    </p>

  </main>


  <script>

    const enterButton = document.getElementById("enter");
    const opening = document.getElementById("opening");
    const home = document.getElementById("home");

    enterButton.addEventListener("click", function () {

      opening.style.display = "none";

      home.style.display = "block";

    });

  </script>

</body>
</html>
