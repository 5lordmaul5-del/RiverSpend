<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>RiverSpend — YOUR SHOP • YOUR FLOW</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #12b7df;
      overflow-x: hidden;
    }


    /* =================================
       APERTURA RIVERSPEND
       ================================= */

    #opening {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100dvh;

      background: #12b7df;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      padding: 20px;

      overflow: hidden;

      z-index: 9999;
    }


    /* =================================
       IMMAGINE RIVERSPEND
       ================================= */

    #opening-image {

      display: block;

      width: 100%;

      max-width: 700px;

      height: auto;

      max-height: 68dvh;

      object-fit: contain;

      object-position: center;

      margin: 0 auto 28px auto;

      border: 0;

    }


    /* =================================
       PULSANTE
       ================================= */

    #enter {

      position: relative;

      z-index: 10;

      width: min(490px, 90vw);

      min-height: 58px;

      padding: 15px 25px;

      border: 2px solid rgba(255,255,255,0.95);

      border-radius: 999px;

      background: rgba(0, 70, 100, 0.78);

      color: #ffffff;

      font-size: clamp(16px, 4vw, 20px);

      font-weight: 700;

      letter-spacing: 0.4px;

      cursor: pointer;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.25);

      backdrop-filter: blur(5px);

      -webkit-backdrop-filter: blur(5px);

    }


    #enter:active {

      transform: scale(0.97);

    }


    /* =================================
       PAGINA SUCCESSIVA TEMPORANEA
       ================================= */

    #home {

      display: none;

      width: 100%;

      min-height: 100dvh;

      padding: 35px 20px;

      background: #f4fbfd;

      color: #123;

    }


    #home h1 {

      margin: 0 0 18px;

      color: #078fbf;

      font-size: 38px;

    }


    #home p {

      margin: 0;

      font-size: 18px;

    }

  </style>

</head>


<body>


  <!-- =================================
       APERTURA
       ================================= -->

  <section id="opening">


    <img
      id="opening-image"
      src=".file_00000000db008246926cc5b0d85ffd53.png
      alt="RiverSpend — YOUR SHOP • YOUR FLOW"
    >


    <button id="enter">

      🌊 ENTRA IN RIVERSPEND

    </button>


  </section>



  <!-- =================================
       PAGINA SUCCESSIVA
       ================================= -->

  <main id="home">

    <h1>
      RiverSpend
    </h1>

    <p>
      YOUR SHOP • YOUR FLOW
    </p>

  </main>



  <script>

    const enterButton =
      document.getElementById("enter");

    const opening =
      document.getElementById("opening");

    const home =
      document.getElementById("home");


    enterButton.addEventListener(
      "click",
      function () {

        opening.style.display = "none";

        home.style.display = "block";

      }
    );

  </script>


</body>

</html>
