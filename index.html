<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiverSpend - your shop your flow</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0040aa;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            color: #ffffff;
        }
        .main-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ffcc00;
            margin: 10px 0 0 0;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
        }
        .subtitle {
            font-style: italic;
            font-size: 14px;
            color: #e0e0e0;
            margin-bottom: 15px;
        }
        .badges {
            font-size: 12px;
            margin-bottom: 25px;
            color: #d1e7dd;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
        }
        .user-card {
            background-color: #002366;
            width: 100%;
            border-radius: 20px;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .user-card p {
            margin: 0 0 10px 0;
            font-size: 14px;
            font-weight: 600;
        }
        .user-btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 10px;
        }
        .pill-btn {
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-blue { background: #ffffff; color: #0040aa; }
        .btn-red { background: #dc3545; color: white; }
        .btn-yellow { background: #ffc107; color: #000; }

        .action-btn {
            width: 100%;
            background: #0088cc;
            border: none;
            padding: 14px;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            text-align: center;
        }
        .btn-piggy { background: #dc3545; }
        .btn-club { background: #6f42c1; }
        .btn-shield { background: #28a745; }

        .section-title {
            align-self: flex-start;
            font-size: 18px;
            font-weight: bold;
            margin: 20px 0 10px 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .products-grid {
            display: flex;
            gap: 15px;
            width: 100%;
        }
        .product-card {
            background: white;
            color: #333;
            border-radius: 12px;
            padding: 12px;
            width: 50%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .product-img {
            width: 100%;
            height: 90px;
            background: #f1f1f1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 8px;
        }
        .product-name {
            font-size: 13px;
            font-weight: bold;
            margin: 0 0 5px 0;
            text-align: center;
        }
        .product-price {
            font-size: 13px;
            color: #28a745;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .add-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 6px 0;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="main-container">
    <h1>RiverSpend</h1>
    <div class="subtitle">your shop your flow</div>
    <div class="badges">🌱 Spedito da RiverLogistics &bull; 🛡️ Protezione Shield</div>

    <div class="user-card">
        <p>Profilo Utente Attivo:</p>
        <div class="user-btn-row">
            <button class="pill-btn btn-blue">Utente Blu 🔵</button>
            <button class="pill-btn btn-red">Utente Rosso 🔴</button>
        </div>
        <div style="display: flex; justify-content: center;">
            <button class="pill-btn btn-yellow">Utente Giallo 🟡</button>
        </div>
    </div>

    <button class="action-btn">+ Vendi / Proponi</button>
    <button class="action-btn" style="background: #0099ff;">🛒 Carrello (0)</button>
    <button class="action-btn btn-piggy">🐷 PiggyBank</button>
    <button class="action-btn btn-club">⭐ RiverClub</button>
    <button class="action-btn btn-shield">📊 Calcolatore Shield</button>

    <div class="section-title">🔥 In Evidenza nel Fiume</div>

    <div class="products-grid">
        <div class="product-card">
            <div class="product-img">⌚</div>
            <div class="product-name">Watch Test</div>
            <div class="product-price">€ 29,99</div>
            <button class="add-btn">Aggiungi</button>
        </div>
        <div class="product-card">
            <div class="product-img">💊</div>
            <div class="product-name">Trinciapollo</div>
            <div class="product-price">€ 10,00</div>
            <button class="add-btn">Aggiungi</button>
        </div>
    </div>
</div>

</body>
</html>
