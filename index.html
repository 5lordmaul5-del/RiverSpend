<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>RiverSpend — YOUR SHOP • YOUR FLOW</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #12b7df;
      overflow: hidden;
    }

    #opening {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: #12b7df;

      overflow: hidden;

      z-index: 9999;
    }

    #opening-image {
      display: block;

      width: 100%;
      max-width: 700px;

      height: auto;
      max-height: 90dvh;

      object-fit: contain;

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
    }

    #home {
      display: none;

      width: 100%;
      min-height: 100dvh;

      padding: 30px 20px;

      background: #f5fbfd;

      color: #123;
    }

    #home h1 {
      color: #078fc0;
    }
  </style>
</head>

<body>

  <section id="opening">

    <img
      id="opening-image"
      src="./file_00000000db008246926cc5b0d85ffd53.png"
      alt="RiverSpend — YOUR SHOP • YOUR FLOW"
    >

  </section>

  <main id="home">

    <h1>RiverSpend</h1>

    <p>YOUR SHOP • YOUR FLOW</p>

  </main>

  <script>
    const opening = document.getElementById("opening");
    const image = document.getElementById("opening-image");
    const home = document.getElementById("home");

    image.addEventListener("click", function () {
      opening.style.display = "none";
      home.style.display = "block";
      document.body.style.overflow = "auto";
    });
  </script>

</body>
</html>
