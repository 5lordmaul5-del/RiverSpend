<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>RiverSpend — YOUR SHOP • YOUR FLOW</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #12b7df;
    }

    #opening {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100dvh;

      background: #12b7df;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    #opening-image {
      display: block;

      width: 100vw;
      height: 100dvh;

      margin: 0;
      padding: 0;

      object-fit: cover;

      border: 0;
      outline: 0;

      user-select: none;
      -webkit-user-drag: none;
    }

    /* Area invisibile sopra il pulsante
       già presente nell'immagine */
    #enter {
      position: absolute;

      left: 10%;
      right: 10%;
      bottom: 12%;

      height: 13%;

      border: 0;
      background: transparent;

      cursor: pointer;

      padding: 0;
      margin: 0;
    }

    #home {
      display: none;

      width: 100%;
      min-height: 100dvh;

      background: #f5fbfd;
    }
  </style>
</head>

<body>

  <section id="opening">

    <img
      id="opening-image"
      src="./file_00000000db008246926cc5b0d85ffd53.png"
      alt="RiverSpend — YOUR SHOP • YOUR FLOW"
    >

    <button
      id="enter"
      aria-label="Entra in RiverSpend"
    ></button>

  </section>

  <main id="home">

  <header class="rs-header">
    <button class="rs-menu">☰</button>
    <div class="rs-logo">RiverSpend</div>
    <button class="rs-search">🔎</button>
    <button class="rs-net">🕸️</button>
  </header>

  <section class="rs-actions">
    <button>VENDI</button>
    <button>COMPRA</button>
  </section>

  <nav class="rs-areas">
    <button class="active">RiverSpend</button>
    <button>RiverSpendShop</button>
    <button>Privati</button>
    <button>Aziende</button>
  </nav>

  <section class="rs-products">
    <h1>RiverSpend</h1>
    <p>I prodotti del mondo RiverSpend</p>

    <div class="product-grid">
      <!-- I prodotti reali verranno caricati da Supabase nel prossimo blocco -->
    </div>
  </section>

</main>

  <script>
    const enter = document.getElementById("enter");
    const opening = document.getElementById("opening");
    const home = document.getElementById("home");

    enter.addEventListener("click", function () {
      opening.style.display = "none";
      home.style.display = "block";
    });
  </script>
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL = "https://rkwqmteuxpdgdhgowbpn.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fl3jgQp7nsP90RRD8Ji21g_ZtTyQAXn";

  const riverSupabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  window.riverSupabase = riverSupabase;

  riverSupabase
    .from("products")
    .select("id")
    .limit(1)
    .then(({ error }) => {
      if (error) {
        console.error("RiverSpend Cloud: collegamento Supabase non riuscito.", error);
      } else {
        console.log("RiverSpend Cloud: Supabase collegato correttamente.");
      }
    });
</script>
</body>
</html>
