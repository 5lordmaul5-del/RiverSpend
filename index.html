mi<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>RiverSpend — YOUR SHOP • YOUR FLOW</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #12b7df;
    }

    #opening {
      position: fixed;
      inset: 0;

      width: 100vw;
      height: 100dvh;

      background: #12b7df;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    #opening-image {
      display: block;

      width: 100vw;
      height: 100dvh;

      margin: 0;
      padding: 0;

      object-fit: cover;

      border: 0;
      outline: 0;

      user-select: none;
      -webkit-user-drag: none;
    }

    /* Area invisibile sopra il pulsante
       già presente nell'immagine */
    #enter {
      position: absolute;

      left: 10%;
      right: 10%;
      bottom: 12%;

      height: 13%;

      border: 0;
      background: transparent;

      cursor: pointer;

      padding: 0;
      margin: 0;
    }

    #home {
      display: none;

      width: 100%;
      min-height: 100dvh;

      background: #f5fbfd;
    }
    /* RIVERSPEND HOME — BLOCCO GRAFICO 1 */

body {
  overflow: auto;
  font-family: Arial, Helvetica, sans-serif;
  color: #12343b;
  background: #f4fbfd;
}

#home {
  min-height: 100dvh;
  background:
    linear-gradient(180deg, #e8faff 0%, #f7fcfd 42%, #ffffff 100%);
}

.rs-header {
  position: sticky;
  top: 0;
  z-index: 20;
  height: 68px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(255,255,255,.94);
  border-bottom: 1px solid #d7edf2;
  box-shadow: 0 2px 12px rgba(0,80,100,.08);
}

.rs-header button {
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 12px;
  background: #e9f8fc;
  color: #087f9e;
  font-size: 21px;
}

.rs-logo {
  flex: 1;
  text-align: center;
  font-size: 25px;
  font-weight: 800;
  letter-spacing: -.5px;
  color: #08a7cf;
}

.rs-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 16px;
}

.rs-actions button {
  height: 52px;
  border: 0;
  border-radius: 15px;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: .5px;
  background: #08a7cf;
  color: white;
  box-shadow: 0 5px 14px rgba(8,167,207,.22);
}

.rs-areas {
  display: flex;
  gap: 8px;
  padding: 0 16px 18px;
  overflow-x: auto;
  scrollbar-width: none;
}

.rs-areas::-webkit-scrollbar {
  display: none;
}

.rs-areas button {
  flex: 0 0 auto;
  padding: 11px 17px;
  border: 1px solid #c8e6ed;
  border-radius: 999px;
  background: white;
  color: #287080;
  font-size: 14px;
  font-weight: 700;
}

.rs-areas button.active {
  background: #08a7cf;
  border-color: #08a7cf;
  color: white;
}

.rs-products {
  padding: 8px 16px 40px;
}

.rs-products h1 {
  margin: 0;
  font-size: 30px;
  color: #12343b;
}

.rs-products p {
  margin: 7px 0 22px;
  color: #63818a;
  font-size: 15px;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

@media (min-width: 700px) {
  .product-grid {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}
  </style>
</head>

<body>

  <section id="opening">

    <img
      id="opening-image"
      src="./file_00000000db008246926cc5b0d85ffd53.png"
      alt="RiverSpend — YOUR SHOP • YOUR FLOW"
    >

    <button
      id="enter"
      aria-label="Entra in RiverSpend"
    ></button>

  </section>

  <main id="home">


  <header class="rs-header">
  <button class="rs-menu" aria-label="Apri categorie">☰</button>

  <div class="rs-logo">RiverSpend</div>

  <button class="rs-search" aria-label="Cerca">⌕</button>

  <button class="rs-net" aria-label="La mia Rete">♧</button>
</header>
    
  <section class="rs-actions">
    <button>VENDI</button>
    <button>COMPRA</button>
  </section>

  <nav class="rs-areas">
    <button class="active">RiverSpend</button>
    <button>RiverSpendShop</button>
    <button>Privati</button>
    <button>Aziende</button>
  </nav>

  <section class="rs-products">
    <h1>RiverSpend</h1>
    <p>I prodotti del mondo RiverSpend</p>

    <div class="product-grid">
      <!-- I prodotti reali verranno caricati da Supabase nel prossimo blocco -->
    </div>
  </section>

</main>

  <script>
    const enter = document.getElementById("enter");
    const opening = document.getElementById("opening");
    const home = document.getElementById("home");

    enter.addEventListener("click", function () {
      opening.style.display = "none";
      home.style.display = "block";
    });
  </script>
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL = "https://rkwqmteuxpdgdhgowbpn.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_fl3jgQp7nsP90RRD8Ji21g_ZtTyQAXn";

  const riverSupabase = createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  window.riverSupabase = riverSupabase;

  riverSupabase
    .from("products")
    .select("id")
    .limit(1)
    .then(({ error }) => {
      if (error) {
        console.error("RiverSpend Cloud: collegamento Supabase non riuscito.", error);
      } else {
        console.log("RiverSpend Cloud: Supabase collegato correttamente.");
      }
    });
</script>
</body>
</html>
